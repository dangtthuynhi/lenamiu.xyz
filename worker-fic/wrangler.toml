# Máy chủ trang Fanfic (tài khoản, truyện, duyệt, tim, bình luận). Chạy lệnh trong thư mục worker-fic/.
#   Thử trong máy:   npx wrangler d1 execute lenamiu-fic --local --file schema.sql   (lần đầu)
#                    npx wrangler dev --port 8789
#   Đưa lên mạng:    npx wrangler deploy
#   (đã làm lần đầu: d1 create lenamiu-fic, d1 execute --remote --file schema.sql, secret put FIC_SALT)
# Trang KHÔNG cho tự đăng ký. Người duyệt tạo tài khoản ở Duyệt truyện → Thành viên.
# Tạo / lấy lại tài khoản người duyệt (in mật khẩu tạm), chạy ở thư mục gốc lenamiu.xyz:
#   node tools/tao-nguoi-duyet.mjs ten_dang_nhap "Bút danh"
name = "lenamiu-fic"
main = "src/index.js"
compatibility_date = "2025-10-01"

[[d1_databases]]
binding = "DB"
database_name = "lenamiu-fic"
database_id = "c6c219fa-0cb5-4b16-88ab-d32d6be70ef9"
