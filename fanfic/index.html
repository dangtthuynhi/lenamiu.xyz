  /* ================= soạn chương ================= */
  async function viewEditor(ctx, id) {
    if (needLogin()) return;
    const isNew = /chuong-moi$/.test(parseHash().path);
    let storyId, storyTitle, chap = null, canPub, pos;
    if (isNew) {
      const d = await api('/my/stories/' + id);
      storyId = d.story.id; storyTitle = d.story.title; canPub = d.canPublish; pos = d.chapters.length + 1;
    } else {
      const d = await api('/my/chapters/' + id);
      chap = d.chapter; storyId = chap.storyId; storyTitle = chap.storyTitle; canPub = d.canPublish;
    }
    if (!ctx.alive()) return;
    ctx.title(isNew ? 'Chương mới – ' + storyTitle : 'Sửa chương – ' + storyTitle);
    const draftKey = 'fic_draft:' + (isNew ? 'new-' + storyId : chap.id);
    const status = chap ? chap.status : 'draft';
    const published = status === 'published';

    const title = h('input', { type: 'text', maxlength: 120, value: chap ? chap.title : '', placeholder: 'Không bắt buộc' });
    // Ô soạn thảo kiểu Google Docs: thấy sao thì người đọc thấy vậy, không còn dấu ** hay *
    const ed = h('div', { class: 'ed-rich prose', contenteditable: 'true', role: 'textbox', 'aria-multiline': 'true',
      'aria-label': 'Nội dung chương', spellcheck: 'true',
      'data-ph': 'Viết truyện ở đây, hoặc dán từ Google Docs / Word (giữ nguyên chữ đậm, nghiêng, căn giữa…)' });
    const load = (stored) => { fill(ed, richNodes(richFromStored(stored))); if (!ed.firstChild) ed.append(h('p', null, h('br'))); };
    load(chap ? chap.body : '');
    const current = () => walkRich(ed);
    const loadedBody = richHtml(current());            // để biết chương đã đăng có sửa chữ hay chỉ đổi ảnh
    const pic = bannerPicker(chap, () => { dirty = true; });
    const meta = h('div', { class: 'ed-meta' }, h('span'), h('span'));
    let dirty = false, saveT, metaT;
    const paintMeta = () => {
      const blocks = current();
      const len = richHtml(blocks).length;
      ed.classList.toggle('ed-empty', !ed.textContent.trim() && !ed.querySelector('hr'));
      meta.firstChild.textContent = fmt(blocksWords(blocks)) + ' chữ' +
        (len > MAX_BODY * 0.9 ? ' · đã dùng ' + Math.round((len / MAX_BODY) * 100) + '% giới hạn một chương' : '');
      meta.firstChild.style.color = len > MAX_BODY ? 'var(--danger)' : '';
    };
    const changed = () => {
      dirty = true;
      clearTimeout(metaT);
      metaT = setTimeout(paintMeta, 250);
      clearTimeout(saveT);
      saveT = setTimeout(() => {
        ls.put(draftKey, { title: title.value, body: richHtml(current()), at: Date.now() });
        meta.lastChild.textContent = 'Đã lưu tạm trên máy này lúc ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      }, 800);
    };
    ed.addEventListener('input', changed);
    title.addEventListener('input', changed);
    // Dán từ Google Docs / Word / trang web: lọc chỉ giữ chữ + định dạng cho phép
    ed.addEventListener('paste', (e) => {
      const cd = e.clipboardData;
      if (!cd) return;
      e.preventDefault();
      const html = cd.getData('text/html');
      const blocks = html ? richFromHtml(html) : walkRich(legacyNodes(cd.getData('text/plain')));
      if (!blocks.length) return;
      let out;
      if (blocks.length === 1 && blocks[0].type === 'p' && !blocks[0].align) {     // 1 đoạn ngắn: chèn ngay giữa dòng
        const d = document.createElement('div');
        d.append(buildInline(blocks[0].runs));
        out = d.innerHTML;
      } else out = richHtml(blocks);
      document.execCommand('insertHTML', false, out);
    });
    ed.addEventListener('drop', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
    const onLeave = (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', onLeave);
    cleanups.push(() => window.removeEventListener('beforeunload', onLeave));

    // ---- thanh công cụ ----
    let prepared = false, lastRange = null;
    const prep = () => {
      if (prepared) return;
      prepared = true;
      try { document.execCommand('styleWithCSS', false, false); document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) { /* trình duyệt cũ */ }
    };
    ed.addEventListener('focus', prep);
    const blockOf = () => {
      const s = getSelection();
      let n = s && s.anchorNode;
      while (n && n !== ed) { if (n.nodeType === 1 && /^(P|DIV|H[1-6]|BLOCKQUOTE)$/.test(n.tagName)) return n; n = n.parentNode; }
      return null;
    };
    const inBlock = (tag) => { const b = blockOf(); const q = b && b.closest(tag); return !!q && ed.contains(q); };
    const run = (name, value) => {
      const s = getSelection();
      if (!(s && s.rangeCount && ed.contains(s.anchorNode))) {          // bấm nút làm mất chỗ đang chọn: chọn lại
        ed.focus();
        if (lastRange) { s.removeAllRanges(); s.addRange(lastRange); }
      }
      prep();
      document.execCommand(name, false, value);       // value bỏ trống = '' (truyền null thì Chrome gắn id="null" cho <hr>)
      sync();
      changed();
    };
    const toggleBlock = (tag) => run('formatBlock', inBlock(tag) ? '<p>' : '<' + tag + '>');
    const alignIcon = (a) => {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 16 16'); svg.setAttribute('width', '16'); svg.setAttribute('height', '16'); svg.setAttribute('aria-hidden', 'true');
      const short = a === 'l' ? [1.5, 10] : a === 'c' ? [4, 12] : [6, 14.5];
      [[1.5, 14.5], short, [1.5, 14.5], short].forEach(([x1, x2], i) => {
        const l = document.createElementNS(ns, 'line');
        const y = String(2.5 + i * 3.7);
        l.setAttribute('x1', x1); l.setAttribute('x2', x2); l.setAttribute('y1', y); l.setAttribute('y2', y);
        l.setAttribute('stroke', 'currentColor'); l.setAttribute('stroke-width', '1.6'); l.setAttribute('stroke-linecap', 'round');
        svg.append(l);
      });
      return svg;
    };
    // onmousedown chặn mặc định để bấm nút không làm mất phần chữ đang bôi đen
    const tool = (label, name, onclick, key) => h('button', { type: 'button', title: name, 'aria-label': name,
      'aria-pressed': key ? 'false' : null, 'data-k': key || null, onmousedown: (e) => e.preventDefault(), onclick }, label);
    const sep = () => h('span', { class: 'sep', 'aria-hidden': 'true' });
    const toolbar = h('div', { class: 'tb', role: 'toolbar', 'aria-label': 'Định dạng chữ' },
      tool(h('b', null, 'B'), 'Chữ đậm (Ctrl+B)', () => run('bold'), 'bold'),
      tool(h('i', null, 'I'), 'Chữ nghiêng (Ctrl+I)', () => run('italic'), 'italic'),
      tool(h('u', null, 'U'), 'Gạch chân (Ctrl+U)', () => run('underline'), 'underline'),
      tool(h('s', null, 'S'), 'Gạch ngang', () => run('strikeThrough'), 'strikeThrough'),
      sep(),
      tool('Tiêu đề', 'Tiêu đề nhỏ', () => toggleBlock('h3'), 'block:h3'),
      tool('❝ Trích dẫn', 'Trích dẫn (thư, tin nhắn…)', () => toggleBlock('blockquote'), 'block:blockquote'),
      sep(),
      tool(alignIcon('l'), 'Căn trái', () => run('justifyLeft'), 'justifyLeft'),
      tool(alignIcon('c'), 'Căn giữa', () => run('justifyCenter'), 'justifyCenter'),
      tool(alignIcon('r'), 'Căn phải', () => run('justifyRight'), 'justifyRight'),
      sep(),
      tool('✻ Chuyển cảnh', 'Chuyển cảnh', () => run('insertHorizontalRule')),
      tool('Bỏ định dạng', 'Bỏ định dạng của phần đang chọn', () => { run('removeFormat'); run('formatBlock', '<p>'); }),
      sep(),
      tool('↶', 'Hoàn tác (Ctrl+Z)', () => run('undo')),
      tool('↷', 'Làm lại (Ctrl+Y)', () => run('redo')));
    function sync() {
      for (const b of toolbar.querySelectorAll('[data-k]')) {
        const k = b.dataset.k;
        let on = false;
        try { on = k.startsWith('block:') ? inBlock(k.slice(6)) : document.queryCommandState(k); } catch (e) { on = false; }
        b.setAttribute('aria-pressed', String(!!on));
      }
    }
    const onSel = () => {
      const s = getSelection();
      if (s && s.rangeCount && ed.contains(s.anchorNode)) { lastRange = s.getRangeAt(0).cloneRange(); sync(); }
    };
    document.addEventListener('selectionchange', onSel);
    cleanups.push(() => document.removeEventListener('selectionchange', onSel));
    ed.addEventListener('keyup', sync);

    // bản đang viết dở trên máy này (mất mạng, lỡ đóng tab...) mới hơn bản trên máy chủ thì hỏi khôi phục
    const local = ls.json(draftKey, null);
    const serverAt = chap ? Date.parse(chap.updated || 0) : 0;
    const restoreBox = local && local.body && local.at > serverAt && (local.body !== richHtml(current()) || local.title !== title.value)
      ? h('p', { class: 'notice warn' }, 'Có bản bạn đang viết dở trên máy này (' + ago(new Date(local.at).toISOString()) + '). ',
          h('button', { type: 'button', class: 'btn sm', onclick: (e) => { title.value = local.title || ''; load(local.body); paintMeta(); dirty = true; e.target.closest('p').remove(); } }, 'Mở lại bản đó'), ' ',
          h('button', { type: 'button', class: 'btn sm', onclick: (e) => { ls.del(draftKey); e.target.closest('p').remove(); } }, 'Bỏ'))
      : null;

    const notes = [];
    if (status === 'rejected' && chap.note) notes.push(h('p', { class: 'notice bad' }, 'Người duyệt nhắn: ' + chap.note + '. Bạn sửa rồi gửi lại nhé.'));
    if (status === 'pending') notes.push(h('p', { class: 'notice warn' }, 'Chương này đang chờ duyệt. Bạn vẫn sửa được, bấm "Cập nhật bản gửi duyệt" để thay bản đã gửi.'));
    if (published && (chap.editStatus === 'pending' || chap.pendingImage)) notes.push(h('p', { class: 'notice warn' }, 'Bản sửa của bạn đang chờ duyệt. Người đọc vẫn thấy bản cũ cho tới khi được duyệt.'));
    if (published && chap.editStatus === 'rejected') notes.push(h('p', { class: 'notice bad' }, 'Bản sửa lần trước không được duyệt' + (chap.note ? ': ' + chap.note : '.')));
    if (published && !canPub && !chap.editStatus && !chap.pendingImage) notes.push(h('p', { class: 'notice' }, 'Chương này đã đăng. Bản sửa sẽ được người duyệt xem trước, trong lúc đó người đọc vẫn thấy bản cũ.'));

    async function save(submit) {
      const blocks = current();
      if (!blocksWords(blocks)) { toast('Chương chưa có nội dung.', true); ed.focus(); return; }
      const bodyHtml = richHtml(blocks);
      if (bodyHtml.length > MAX_BODY) { toast('Chương dài quá giới hạn, bạn chia thành 2 chương nhé.', true); return; }
      // chương đã đăng mà chữ không đổi: chỉ gửi ảnh (khỏi tạo "bản sửa" giống hệt bản cũ)
      const sameText = published && title.value === (chap.title || '') && bodyHtml === loadedBody;
      if (sameText && !pic.changed()) { toast('Bạn chưa thay đổi gì cả.'); return; }
      bar2.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      try {
        const body = { title: title.value, body: bodyHtml, submit };
        const d = sameText ? { status: 'published', editStatus: chap.editStatus === 'pending' ? 'pending' : null }
          : isNew ? await api('/my/stories/' + storyId + '/chapters', { method: 'POST', body })
          : await api('/my/chapters/' + chap.id, { method: 'PUT', body });
        dirty = false;
        clearTimeout(saveT);
        ls.del(draftKey);
        listCache = null;
        let imgWait = false, imgErr = null;
        try { imgWait = await pic.save(isNew ? d.id : chap.id); } catch (e2) { imgErr = e2; }
        const msg = d.editStatus === 'pending' || imgWait ? 'Đã gửi bản sửa, chờ người duyệt xem nhé.'
          : d.status === 'published' ? (published ? 'Đã lưu thay đổi.' : 'Đã đăng! 🎉')
          : d.status === 'pending' ? 'Đã gửi duyệt. Duyệt xong là chương hiện lên trang 💗' : 'Đã lưu nháp.';
        if (imgErr) toast('Đã lưu chương nhưng chưa lưu được ảnh (' + imgErr.message + '). Bạn mở chương ra thử lại nhé.', true);
        else toast(msg);
        go('/truyen/' + storyId + '/sua');
      } catch (e) {
        toast(e.message, true);
        bar2.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      }
    }
    const buttons = [];
    if (published) {
      if ((chap.editStatus || chap.pendingImage) && !canPub) {
        buttons.push(h('button', { type: 'button', class: 'btn', onclick: async () => {
          if (!confirm('Huỷ bản sửa, giữ nguyên bản đang hiện trên trang?')) return;
          try { await api('/my/chapters/' + chap.id + '/cancel-edit', { method: 'POST' }); dirty = false; ls.del(draftKey); toast('Đã huỷ bản sửa.'); go('/truyen/' + storyId + '/sua'); }
          catch (e) { toast(e.message, true); }
        } }, 'Huỷ bản sửa'));
      }
      buttons.push(h('button', { type: 'button', class: 'btn primary', onclick: () => save(false) }, canPub ? 'Lưu thay đổi' : 'Gửi bản sửa để duyệt'));
    } else {
      buttons.push(h('button', { type: 'button', class: 'btn', onclick: () => save(false) }, status === 'pending' ? 'Rút về nháp' : 'Lưu nháp'));
      buttons.push(h('button', { type: 'button', class: 'btn primary', onclick: () => save(true) },
        canPub ? 'Đăng ngay' : status === 'pending' ? 'Cập nhật bản gửi duyệt' : 'Gửi duyệt'));
    }
    const bar2 = h('div', { class: 'actions-bar' }, h('a', { class: 'btn', href: '#/truyen/' + storyId + '/sua', style: 'margin-right:auto' }, 'Quay lại'), buttons);

    ctx.mount(h('div', { class: 'narrow', style: 'margin:0 auto' },
      h('a', { href: '#/truyen/' + storyId + '/sua', class: 'small' }, '← ' + storyTitle),
      h('div', { class: 'page-head' }, h('h1', null, isNew ? 'Chương ' + pos + ' (mới)' : 'Sửa chương'), chap ? badge(status) : null),
      notes, restoreBox,
      h('label', { class: 'field' }, h('span', null, 'Tên chương'), title),
      pic.el,
      h('div', { class: 'field' }, h('span', null, 'Nội dung'), toolbar, ed),
      meta,
      h('p', { class: 'help' }, 'Bôi đen chữ rồi bấm nút để in đậm, nghiêng, gạch chân, căn giữa… Phím tắt: ',
        h('code', null, 'Ctrl+B'), ' ', h('code', null, 'Ctrl+I'), ' ', h('code', null, 'Ctrl+U'),
        '. Dán từ Google Docs / Word giữ nguyên định dạng. Bài đang viết được lưu tạm trên máy này.'),
      bar2));
    paintMeta();
    if (isNew) ed.focus();
  }

  /* ================= người duyệt ================= */
  async function viewAdmin(ctx) {
    if (needLogin()) return;
    if (me.role !== 'admin') throw new Error('Chỉ người duyệt mới vào được trang này.');
    ctx.title('Duyệt truyện');
    const tab = ctx.q.get('tab') || 'cho';
    const tabs = h('nav', { class: 'tabs', 'aria-label': 'Mục duyệt' },
      [['cho', 'Chờ duyệt' + (queue ? ' (' + queue + ')' : '')], ['thanh-vien', 'Thành viên'], ['truyen', 'Tất cả truyện']].map(([k, t]) =>
        h('a', { href: '#/duyet' + (k === 'cho' ? '' : '?tab=' + k), 'aria-current': tab === k ? 'page' : null }, t)));
    const head = h('div', { class: 'page-head' }, h('h1', null, 'Duyệt truyện'));
    if (tab === 'thanh-vien') return adminUsers(ctx, head, tabs);
    if (tab === 'truyen') return adminStories(ctx, head, tabs);

    const { items } = await api('/admin/queue');
    if (!ctx.alive()) return;
    const box = h('div');
    const setQueue = (n) => { queue = n; renderNav(); tabs.firstChild.textContent = 'Chờ duyệt' + (n ? ' (' + n + ')' : ''); };
    setQueue(items.length);
    const empty = () => h('div', { class: 'empty card' }, h('p', null, 'Hết việc rồi! Không có gì chờ duyệt 🎉'));
    const KIND = { story: ['🆕 Truyện mới', 'b-acc'], chapter: ['➕ Chương mới', 'b-ok'], edit: ['✏️ Sửa chương', 'b-wait'],
                   image: ['🖼 Đổi ảnh chương', 'b-wait'], meta: ['📝 Sửa thông tin truyện', 'b-wait'] };

    const card = (it) => {
      const el = h('article', { class: 'card q-item' });
      const act = async (action, note) => {
        el.querySelectorAll('button').forEach((b) => { b.disabled = true; });
        try {
          const path = it.kind === 'meta' ? '/admin/stories/' + it.id : '/admin/chapters/' + it.id;
          const d = await api(path, { method: 'POST', body: { action: it.kind === 'meta' ? action + '-meta' : action, note } });
          el.remove();
          listCache = null;
          setQueue(d.queue);
          toast(action === 'approve' ? 'Đã duyệt ✓' : 'Đã từ chối, tác giả sẽ thấy lời nhắn.');
          if (!box.children.length) box.append(empty());
        } catch (e) { toast(e.message, true); el.querySelectorAll('button').forEach((b) => { b.disabled = false; }); }
      };
      const reason = h('textarea', { rows: 2, maxlength: 500, placeholder: 'Lý do / lời nhắn cho tác giả (tác giả sẽ thấy)' });
      const rejectBox = h('div', { hidden: true, style: 'margin-top:10px' }, reason,
        h('div', { class: 'row', style: 'margin-top:8px' },
          h('button', { type: 'button', class: 'btn sm danger', onclick: () => act('reject', reason.value) }, 'Gửi từ chối'),
          h('button', { type: 'button', class: 'btn sm', onclick: () => { rejectBox.hidden = true; } }, 'Thôi')));
      const s = it.story;
      let content;
      if (it.kind === 'meta') {
        const rows = [];
        const diff = (label, a, b) => { if ((a || '') !== (b || '')) rows.push(h('dt', null, label), h('dd', null, h('del', null, a || '(trống)'), h('br'), h('ins', null, b || '(trống)'))); };
        if (it.next) {
          diff('Tên', s.title, it.next.title);
          diff('Tóm tắt', s.summary, it.next.summary);
          diff('Thẻ', s.tags.join(', '), (it.next.tags || []).join(', '));
          diff('Độ tuổi', RATING[s.rating], RATING[it.next.rating]);
        }
        content = [
          h('h3', null, s.title),
          it.nextCover ? h('div', { class: 'cover-diff' },
            coverBox(s, { src: null, priv: s.cover ? 'live' : null }), h('span', null, '→ ảnh bìa mới'),
            coverBox(s, { src: null, priv: 'pending' })) : null,
          rows.length ? h('dl', { class: 'diff' }, rows) : null];
      } else {
        // ảnh đầu chương: chương mới → ảnh của chương; sửa chương có ảnh mới → ảnh cũ → ảnh mới
        const pic = it.nextImage
          ? h('div', { class: 'banner-diff' }, it.image ? bannerBox(it.id, it.image) : bannerBox(0, 0), h('span', null, '→'),
              bannerBox(it.id, 0, { priv: 'pending' }))
          : it.image && (it.kind === 'story' || it.kind === 'chapter') ? h('div', { class: 'q-banner' }, bannerBox(it.id, 0, { priv: 'live' })) : null;
        content = [
          h('h3', null, s.title),
          h('p', { class: 'small', style: 'margin:0' }, 'Chương ' + it.pos + ': ' + (it.title || '(không tên)') +
            (it.kind === 'edit' && it.oldTitle !== it.title ? ' (tên cũ: ' + (it.oldTitle || 'không tên') + ')' : '') + ' · ' + fmt(it.words) + ' chữ'),
          pic,
          it.kind === 'story' ? h('div', { class: s.cover ? 'q-story' : null, style: 'margin-top:8px' },
            s.cover ? coverBox(s, { src: null, priv: 'live' }) : null,
            h('div', null,
              h('div', { class: 'row' }, ratingBadge(s.rating) || h('span', { class: 'badge' }, RATING.all), s.tags.map((t) => h('span', { class: 'tag' }, t))),
              s.summary ? h('p', { class: 'small muted', style: 'white-space:pre-wrap;margin:6px 0 0' }, s.summary) : null)) : null,
          it.kind === 'image' ? null   // chỉ đổi ảnh, chữ giữ nguyên
            : h('details', null, h('summary', null, it.kind === 'edit' ? 'Đọc bản sửa' : 'Đọc nội dung'), h('div', { class: 'prose' }, renderBody(it.body)))
        ];
      }
      addKids(el, [
        h('div', { class: 'row' }, h('span', { class: 'badge ' + KIND[it.kind][1] }, KIND[it.kind][0]),
          h('span', { class: 'muted small' }, 'của ' + it.author.name + ' (@' + it.author.username + ')' + (it.updated ? ' · ' + ago(it.updated) : ''))),
        content,
        h('div', { class: 'row', style: 'margin-top:12px' },
          h('button', { type: 'button', class: 'btn primary sm', onclick: () => act('approve') }, '✓ Duyệt'),
          h('button', { type: 'button', class: 'btn sm danger', onclick: () => { rejectBox.hidden = false; reason.focus(); } }, '✗ Từ chối')),
        rejectBox]);
      return el;
    };
    box.append(...(items.length ? items.map(card) : [empty()]));
    ctx.mount(head, tabs, box);
  }

  async function adminUsers(ctx, head, tabs) {
    const { users } = await api('/admin/users');
    if (!ctx.alive()) return;
    const row = (u) => {
      const li = h('li');
      const paint = () => {
        const pw = h('input', { type: 'password', autocomplete: 'new-password', minlength: 8, placeholder: 'Mật khẩu mới (ít nhất 8 ký tự)' });
        const pwBox = h('form', { hidden: true, class: 'row', style: 'margin-top:8px', onsubmit: async (e) => {
          e.preventDefault();
          if (pw.value.length < 8) return toast('Mật khẩu cần ít nhất 8 ký tự.', true);
          try { await api('/admin/users/' + u.id, { method: 'POST', body: { pass: await passHash(u.username, pw.value) } }); toast('Đã đặt lại mật khẩu. Gửi mật khẩu mới cho ' + u.name + ' nhé.'); pwBox.hidden = true; }
          catch (e2) { toast(e2.message, true); }
        } }, h('div', { style: 'flex:1 1 220px' }, pw), h('button', { type: 'submit', class: 'btn sm primary' }, 'Lưu'));
        const set = async (body, msg) => {
          try { await api('/admin/users/' + u.id, { method: 'POST', body }); Object.assign(u, body); toast(msg); paint(); }
          catch (e) { toast(e.message, true); }
        };
        const self = u.id === me.id, isAdmin = u.role === 'admin';
        fill(li,
          h('div', { class: 'row' }, h('b', null, u.name), h('span', { class: 'muted small' }, '@' + u.username),
            h('span', { class: 'badge ' + (isAdmin ? 'b-acc' : u.role === 'trusted' ? 'b-ok' : '') }, ROLE[u.role]),
            u.banned ? h('span', { class: 'badge b-no' }, 'Bị khoá') : null),
          h('div', { class: 'muted small' }, u.stories + ' truyện · ' + u.comments + ' bình luận · tham gia ' + dateVN(u.created)),
          !self && !isAdmin ? h('div', { class: 'row', style: 'margin-top:8px' },
            h('a', { class: 'btn sm', href: '#/?tac-gia=' + encodeURIComponent(u.username) }, 'Xem truyện'),
            h('button', { type: 'button', class: 'btn sm', onclick: () => set({ role: u.role === 'trusted' ? 'user' : 'trusted' },
              u.role === 'trusted' ? 'Đã bỏ tin cậy: truyện của ' + u.name + ' lại phải chờ duyệt.' : 'Đã bật tin cậy: ' + u.name + ' đăng là hiện luôn.') },
              u.role === 'trusted' ? 'Bỏ tin cậy' : '⭐ Tin cậy (đăng thẳng)'),
            h('button', { type: 'button', class: 'btn sm danger', onclick: () => {
              if (!u.banned && !confirm('Khoá ' + u.name + '? Họ bị đăng xuất, không đăng nhập được, truyện và bình luận bị ẩn.')) return;
              set({ banned: !u.banned }, u.banned ? 'Đã mở khoá.' : 'Đã khoá tài khoản.');
            } }, u.banned ? 'Mở khoá' : 'Khoá'),
            h('button', { type: 'button', class: 'btn sm', onclick: () => { pwBox.hidden = !pwBox.hidden; if (!pwBox.hidden) pw.focus(); } }, 'Đặt lại mật khẩu')) : null,
          pwBox);
      };
      paint();
      return li;
    };
    const list = h('ul', { class: 'people' }, users.map(row));
    const countLine = () => fmt(users.length) + ' thành viên. "Tin cậy" = đăng truyện là hiện luôn, không cần chờ duyệt (bạn vẫn ẩn / xoá được).';
    const count = h('p', { class: 'muted small' }, countLine());

    // Tạo tài khoản: trang không cho tự đăng ký, chỉ người duyệt tạo rồi gửi tên đăng nhập + mật khẩu cho người viết
    const nu = h('input', { type: 'text', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', required: true,
                            minlength: 3, maxlength: 20, placeholder: 'vd: banhbao' });
    nu.addEventListener('input', () => { const v = norm(nu.value).replace(/[^a-z0-9_]/g, ''); if (v !== nu.value) nu.value = v; });
    const nn = h('input', { type: 'text', autocomplete: 'off', required: true, minlength: 2, maxlength: 40, placeholder: 'Tên hiện trên truyện' });
    const np = h('input', { type: 'text', autocomplete: 'off', spellcheck: 'false', required: true, minlength: 8, maxlength: 64 });
    const genPass = () => {
      const abc = 'abcdefghjkmnpqrstuvwxyz23456789';          // bỏ chữ dễ nhầm (l, o, 0, 1, i)
      const a = new Uint8Array(10);
      crypto.getRandomValues(a);
      np.value = [...a].map((x) => abc[x % abc.length]).join('');
    };
    genPass();
    const nr = h('select', null, h('option', { value: 'user' }, 'Thành viên (đăng phải chờ duyệt)'),
      h('option', { value: 'trusted' }, 'Tin cậy (đăng là hiện luôn)'));
    const result = h('div', { class: 'notice good', hidden: true, style: 'margin:16px 0 0' });
    const createBtn = h('button', { type: 'submit', class: 'btn primary' }, 'Tạo tài khoản');
    const form = h('form', { class: 'card', style: 'margin-bottom:22px', onsubmit: async (e) => {
      e.preventDefault();
      createBtn.disabled = true;
      try {
        const username = nu.value.trim().toLowerCase();
        const pass = np.value;
        const d = await api('/admin/users', { method: 'POST',
          body: { username, name: nn.value, pass: await passHash(username, pass), role: nr.value } });
        const msg = 'Tài khoản đăng truyện LenaMiu Fanfic của bạn:\nTên đăng nhập: ' + username + '\nMật khẩu: ' + pass +
          '\nĐăng nhập tại: https://lenamiu.xyz/fanfic/#/dang-nhap\n(Vào mục Tài khoản để đổi mật khẩu nhé)';
        fill(result, h('b', null, 'Đã tạo tài khoản cho ' + d.user.name + '!'), ' Gửi nội dung này cho họ:',
          h('pre', { class: 'creds' }, msg),
          h('button', { type: 'button', class: 'btn sm', onclick: async () => {
            try { await navigator.clipboard.writeText(msg); toast('Đã chép, dán vào tin nhắn gửi cho ' + d.user.name + ' nhé.'); }
            catch (er) { toast('Không chép được, bạn bôi đen đoạn trên để chép nhé.', true); }
          } }, '📋 Chép'));
        result.hidden = false;
        const u = Object.assign({ banned: false, created: new Date().toISOString(), stories: 0, comments: 0 }, d.user);
        users.unshift(u);
        list.prepend(row(u));
        count.textContent = countLine();
        nu.value = ''; nn.value = ''; genPass();
      } catch (e2) { toast(e2.message, true); }
      createBtn.disabled = false;
    } },
      h('h2', { style: 'margin-top:0;font-size:1.1rem' }, '➕ Tạo tài khoản'),
      h('p', { class: 'muted small', style: 'margin-top:-4px' }, 'Trang không cho tự đăng ký. Bạn tạo tài khoản ở đây rồi gửi tên đăng nhập + mật khẩu cho người viết.'),
      h('div', { class: 'grid2' },
        h('label', { class: 'field' }, h('span', null, 'Tên đăng nhập'), nu, h('small', null, 'Chữ thường không dấu, số, dấu _. Không đổi được.')),
        h('label', { class: 'field' }, h('span', null, 'Bút danh'), nn, h('small', null, 'Người viết tự đổi được sau.'))),
      h('div', { class: 'grid2' },
        h('div', { class: 'field' }, h('span', null, 'Mật khẩu'),
          h('div', { class: 'row', style: 'flex-wrap:nowrap' }, np,
            h('button', { type: 'button', class: 'btn sm', title: 'Tạo mật khẩu khác', 'aria-label': 'Tạo mật khẩu khác', onclick: genPass }, '🎲')),
          h('small', null, 'Mật khẩu tạo ngẫu nhiên, đổi tuỳ ý (ít nhất 8 ký tự).')),
        h('label', { class: 'field' }, h('span', null, 'Quyền'), nr)),
      createBtn, result);

    ctx.mount(head, tabs, form, count, list);
  }

  async function adminStories(ctx, head, tabs) {
    const { stories } = await api('/admin/stories');
    if (!ctx.alive()) return;
    const row = (s) => {
      const li = h('li');
      const act = async (action, msg) => {
        try {
          const d = await api('/admin/stories/' + s.id, { method: 'POST', body: { action } });
          listCache = null; queue = d.queue; renderNav(); toast(msg);
          if (action === 'delete') li.remove(); else render();
        } catch (e) { toast(e.message, true); }
      };
      li.append(
        h('div', { class: 'row' }, h('b', null, s.title), badge(s.status), s.author.banned ? h('span', { class: 'badge b-no' }, 'Tác giả bị khoá') : null),
        h('div', { class: 'muted small' }, 'của ' + s.author.name + ' (@' + s.author.username + ') · ' + s.published + '/' + s.total + ' chương đã đăng · 👁 ' + fmt(s.reads) + ' · tạo ' + dateVN(s.created)),
        h('div', { class: 'row', style: 'margin-top:8px' },
          s.status === 'published' && s.published ? h('a', { class: 'btn sm', href: '#/truyen/' + s.id }, 'Xem') : null,
          h('a', { class: 'btn sm', href: '#/truyen/' + s.id + '/sua' }, 'Sửa'),
          s.status === 'hidden'
            ? h('button', { type: 'button', class: 'btn sm', onclick: () => act('unhide', 'Đã hiện lại truyện.') }, 'Hiện lại')
            : h('button', { type: 'button', class: 'btn sm', onclick: () => { if (confirm('Ẩn truyện "' + s.title + '" khỏi trang?')) act('hide', 'Đã ẩn truyện.'); } }, 'Ẩn'),
          h('button', { type: 'button', class: 'btn sm danger', onclick: () => {
            if (confirm('Xoá hẳn truyện "' + s.title + '" cùng mọi chương, tim, bình luận? Không khôi phục được.')) act('delete', 'Đã xoá truyện.');
          } }, 'Xoá')));
      return li;
    };
    ctx.mount(head, tabs, stories.length ? h('ul', { class: 'people' }, stories.map(row)) : h('div', { class: 'empty card' }, 'Chưa có truyện nào.'));
  }

  /* ================= khởi động ================= */
  applyReader();
  renderNav();
  loadMe().then(render);
  // quay lại tab sau một lúc thì cập nhật số mục chờ duyệt
  document.addEventListener('visibilitychange', () => { if (!document.hidden && me && me.role === 'admin') loadMe(); });
})();
</script>
</body>
</html>
