<!-- Be Vietnam Pro cho giao diện, Lora (có chân) cho chữ truyện. Tải song song, không bắt trang chờ. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap"

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap"></noscript>
<style>
  :root {
    color-scheme: light;
    --bg: #faf7f6; --surface: #ffffff; --surface-2: #f1ecec;
    --text: #1d1a1f; --muted: #6c6570; --line: rgba(29, 26, 31, .10);
    --accent: #c13a6c; --on-accent: #ffffff; --danger: #c62828;
    --ok: #1f7a4d; --warn: #9a6200;
    --shadow: 0 1px 2px rgba(29, 26, 31, .06), 0 10px 28px -14px rgba(29, 26, 31, .28);
    --rd-size: 19px; --rd-lh: 1.8; --rd-font: "Lora", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121014; --surface: #1b181e; --surface-2: #26222a;
      --text: #f3eff4; --muted: #a39ca8; --line: rgba(255, 255, 255, .09);
      --accent: #f06d9b; --on-accent: #1a0d13; --danger: #ff7b72;
      --ok: #5fd39a; --warn: #f0b75a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -14px rgba(0, 0, 0, .8);
    }
  }
  /* nền đọc truyện người đọc tự chọn (chỉ áp dụng ở trang đọc) */
  :root.rd-light {
    color-scheme: light;
    --bg: #faf7f6; --surface: #ffffff; --surface-2: #f1ecec;
    --text: #1d1a1f; --muted: #6c6570; --line: rgba(29, 26, 31, .10);
    --accent: #c13a6c; --on-accent: #ffffff;
  }
  :root.rd-paper {
    color-scheme: light;
    --bg: #f3ead7; --surface: #faf4e6; --surface-2: #eadfc6;
    --text: #3a2e22; --muted: #7a6a56; --line: rgba(58, 46, 34, .14);
    --accent: #a8456a; --on-accent: #ffffff;
  }
  :root.rd-dark {
    color-scheme: dark;
    --bg: #0f0e10; --surface: #19171b; --surface-2: #242126;
    --text: #e6e0e8; --muted: #9a93a0; --line: rgba(255, 255, 255, .09);
    --accent: #f06d9b; --on-accent: #1a0d13;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 16px/1.6 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1040px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  .narrow { max-width: 760px; }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  h1, h2, h3 { line-height: 1.3; letter-spacing: -.01em; text-wrap: balance; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }

  /* ---------- đầu trang ---------- */
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 8px 16px;
    padding-top: 16px; padding-bottom: 14px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; min-width: 0;
    font-size: 1.2rem; font-weight: 700; color: var(--text); text-decoration: none; white-space: nowrap;
  }
  .brand img { width: 30px; height: 30px; flex: none; }
  .brand span { overflow: hidden; text-overflow: ellipsis; }
  .brand b { color: var(--accent); }
  .nav { display: flex; align-items: center; gap: 4px; flex: none; }
  .nav-a {
    display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 6px 12px;
    border-radius: 999px; color: var(--text); text-decoration: none; font-size: .9rem; font-weight: 600;
    cursor: pointer; white-space: nowrap; list-style: none;
  }
  .nav-a::-webkit-details-marker { display: none; }
  .nav-a:hover { background: var(--surface-2); }
  .nav-a.strong { color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, var(--surface)); }
  .dot {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
    font-size: .72rem; font-weight: 700; display: inline-grid; place-items: center;
  }
  .menu { position: relative; }
  .menu-list {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 220px; padding: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  }
  .menu-list a, .menu-list button {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
    padding: 9px 12px; border: 0; border-radius: 10px; background: none; color: var(--text);
    font: inherit; font-size: .92rem; text-align: left; text-decoration: none; cursor: pointer;
  }
  .menu-list a:hover, .menu-list button:hover { background: var(--surface-2); }
  .me-name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 560px) {
    .hide-sm { display: none; }
    .top { gap: 8px; }
    .brand { gap: 8px; }
    .brand span { font-size: 1.05rem; }
    .nav-a { padding: 6px 10px; }
    .me-name { max-width: 96px; }
  }

  /* ---------- nút, nhãn, ô nhập ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 42px; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font: inherit; font-size: .92rem; font-weight: 600;
    text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.danger { color: var(--danger); }
  .btn.sm { min-height: 34px; padding: 5px 13px; font-size: .84rem; }
  .btn:disabled { opacity: .55; cursor: wait; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .badge {
    display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; font-size: .74rem;
    font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap;
  }
  .b-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, var(--surface)); }
  .b-wait { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
  .b-no { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
  .b-acc { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .tag {
    display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .78rem; color: var(--muted);
    border: 1px solid var(--line); text-decoration: none; background: transparent; font-family: inherit; cursor: pointer;
  }
  .tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }

  .field { display: block; margin-bottom: 16px; }
  .field > span { display: block; margin-bottom: 6px; font-size: .9rem; font-weight: 600; }
  .field small { display: block; margin-top: 5px; color: var(--muted); font-size: .8rem; }
  input[type="text"], input[type="password"], input[type="search"], input[type="email"], select, textarea {
    width: 100%; min-height: 44px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font: inherit; font-size: 16px;
  }
  textarea { resize: vertical; line-height: 1.6; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; margin-bottom: 16px; }
  .check input { width: 18px; height: 18px; margin-top: 3px; flex: none; accent-color: var(--accent); }
  .form { max-width: 480px; margin: 8px auto 0; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    box-shadow: var(--shadow);
  }
  .notice {
    padding: 12px 14px; border-radius: 12px; margin: 0 0 16px; font-size: .9rem;
    background: var(--surface-2); border-left: 3px solid var(--muted);
  }
  .notice.warn { border-color: var(--warn); }
  .notice.bad { border-color: var(--danger); }
  .notice.good { border-color: var(--ok); }
  .err { color: var(--danger); font-size: .88rem; margin: 0 0 12px; min-height: 1.2em; }

  .loading { padding: 64px 0; text-align: center; color: var(--muted); }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 14px; }

  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 60;
    transform: translateX(-50%); max-width: calc(100% - 32px); padding: 11px 18px; border-radius: 12px;
    background: var(--text); color: var(--bg); font-size: .92rem; font-weight: 500; box-shadow: var(--shadow);
    animation: toast-in .2s ease;
  }
  .toast.bad { background: var(--danger); color: #fff; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }

  /* ---------- trang chủ ---------- */
  .hero { padding: 18px 0 8px; }
  .hero h1 { margin: 0 0 6px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
  .hero p { margin: 0 0 16px; color: var(--muted); max-width: 60ch; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 12px; }
  .tools input { flex: 1 1 240px; }
  .tools select { flex: 0 0 auto; width: auto; }
  .filter-tags { margin-bottom: 18px; }
  .section-title { margin: 26px 0 12px; font-size: 1.05rem; }
  .stories { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .stories { grid-template-columns: 1fr 1fr; } }
  .story {
    display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none;
    transition: border-color .15s ease, transform .15s ease;
  }
  .story:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); transform: translateY(-1px); }
  .story h3 { margin: 0; font-size: 1.12rem; }
  .story .by { font-size: .86rem; color: var(--muted); }
  .story .sum {
    margin: 0; color: var(--muted); font-size: .92rem;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--muted); }
  .cont {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px;
    border-radius: 14px; background: color-mix(in srgb, var(--accent) 9%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); color: var(--text); text-decoration: none;
  }
  .cont + .cont { margin-top: 8px; }
  .cont b { display: block; }
  .cont span { font-size: .84rem; color: var(--muted); }

  /* ---------- trang truyện ---------- */
  .story-head h1 { margin: 10px 0 6px; font-size: clamp(1.5rem, 4vw, 2rem); }
  .summary { white-space: pre-wrap; margin: 16px 0; }
  .toc { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .toc li { border-bottom: 1px solid var(--line); }
  .toc a {
    display: flex; justify-content: space-between; gap: 12px; padding: 13px 4px;
    color: var(--text); text-decoration: none;
  }
  .toc a:hover { color: var(--accent); }
  .toc .now { color: var(--accent); font-weight: 600; }
  .toc small { color: var(--muted); white-space: nowrap; }

  /* ---------- trang đọc ---------- */
  .progress {
    position: fixed; left: 0; top: 0; z-index: 50; height: 3px; width: 0; background: var(--accent);
    transition: width .1s linear;
  }
  .rd-bar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 0; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .rd-bar a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; font-weight: 600; text-decoration: none; }
  .rd-panel {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 25; width: min(320px, calc(100vw - 32px));
    padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .rd-panel .lbl { font-size: .78rem; font-weight: 700; color: var(--muted); margin: 10px 0 6px; text-transform: uppercase; letter-spacing: .05em; }
  .rd-panel .lbl:first-child { margin-top: 0; }
  .seg { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
  .seg button {
    flex: 1; min-height: 36px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
  .reader { max-width: 700px; margin: 0 auto; }
  .ch-head { padding: 28px 0 8px; text-align: center; }
  .ch-head .kicker { margin: 0 0 6px; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .ch-head h1 { margin: 0 0 6px; font-family: var(--rd-font); font-weight: 600; font-size: calc(var(--rd-size) * 1.45); }
  .prose {
    font-family: var(--rd-font); font-size: var(--rd-size); line-height: var(--rd-lh);
    overflow-wrap: break-word; padding: 12px 0 8px;
  }
  .prose p { margin: 0 0 1.05em; }
  .prose hr { border: 0; margin: 1.6em 0; text-align: center; color: var(--muted); }
  .prose hr::before { content: "✻   ✻   ✻"; white-space: pre; font-size: .85em; }
  .prose h3 { margin: 1.5em 0 .7em; font-family: var(--rd-font); font-size: 1.12em; font-weight: 600; line-height: 1.45; }
  .prose blockquote {
    margin: 0 0 1.05em; padding: .55em 1em; border-left: 3px solid color-mix(in srgb, var(--accent) 50%, var(--line));
    border-radius: 0 10px 10px 0; background: color-mix(in srgb, var(--accent) 6%, transparent);
  }
  .prose .c { text-align: center; }
  .prose .r { text-align: right; }
  .prose strong { font-weight: 700; }
  .prose u { text-underline-offset: .18em; }
  .end-box { margin: 28px 0 8px; padding: 22px 16px; text-align: center; border-top: 1px solid var(--line); }
  .heart {
    display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 10px 22px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--surface);
    color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; transition: transform .15s ease;
  }
  .heart[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .heart:active { transform: scale(.96); }
  .heart.pop { animation: pop .35s ease; }
  @keyframes pop { 50% { transform: scale(1.12); } }
  .ch-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0; }
  .ch-nav .btn { white-space: normal; text-align: center; }
  .ch-nav .next { grid-column: 2; }
  .ch-select { margin: 0 0 8px; }

  .comments { margin: 32px 0 0; padding-top: 8px; border-top: 1px solid var(--line); }
  .comments h2 { font-size: 1.1rem; }
  .cmts { list-style: none; margin: 0 0 18px; padding: 0; }
  .cmt { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cmt-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .86rem; }
  .cmt-head time { color: var(--muted); }
  .cmt-head .del { margin-left: auto; border: 0; background: none; color: var(--muted); font: inherit; font-size: .8rem; cursor: pointer; }
  .cmt-head .del:hover { color: var(--danger); }
  .cmt-body { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmt-who { display: grid; gap: 0 12px; grid-template-columns: 1fr; }
  .cmt-who .field { margin-bottom: 12px; }
  @media (min-width: 560px) { .cmt-who { grid-template-columns: 1fr 1fr; } }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  /* ---------- truyện của tôi / soạn truyện ---------- */
  .page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 18px; }
  .page-head h1 { margin: 0; font-size: 1.5rem; }
  .mine { display: grid; gap: 12px; }
  .mine .card { padding: 16px; }
  .mine h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .ch-rows { list-style: none; margin: 0; padding: 0; }
  .ch-rows li {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .ch-rows .t { min-width: 0; flex: 1 1 220px; }
  .ch-rows .note { display: block; font-size: .82rem; color: var(--danger); }
  /* thanh công cụ dính trên đầu khi cuộn chương dài; điện thoại thì vuốt ngang */
  .tb {
    position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 8px 0;
    background: var(--bg);
  }
  @media (max-width: 640px) {
    /* điện thoại: vuốt ngang để thấy thêm nút, mép phải mờ dần để biết còn nút */
    .tb { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
          -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
  }
  .tb::-webkit-scrollbar { display: none; }
  .tb button {
    flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 38px; min-height: 38px;
    padding: 4px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font: inherit; font-size: .86rem; cursor: pointer; white-space: nowrap;
  }
  .tb button:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .tb button[aria-pressed="true"] {
    color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    background: color-mix(in srgb, var(--accent) 11%, var(--surface));
  }
  .tb .sep { flex: none; width: 1px; height: 22px; margin: 0 4px; background: var(--line); }
  .ed-rich {
    --rd-size: 17px; position: relative; min-height: 55vh; padding: 14px 16px 24px; outline: none;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  }
  .ed-rich:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .ed-rich > :first-child { margin-top: 0; }
  .ed-rich.ed-empty::before {
    content: attr(data-ph); position: absolute; left: 16px; right: 16px; top: 14px; color: var(--muted); pointer-events: none;
  }
  .ed-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin: 6px 0 16px; font-size: .8rem; color: var(--muted); }
  .help { font-size: .82rem; color: var(--muted); margin: 0 0 16px; }
  .help code { padding: 1px 5px; border-radius: 6px; background: var(--surface-2); font-size: .95em; }
  .actions-bar {
    position: sticky; bottom: 0; z-index: 10; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
    padding: 12px 0 max(12px, env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line);
  }

  .tabs { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--surface-2); margin: 0 0 18px; width: fit-content; max-width: 100%; overflow-x: auto; }
  .tabs a { padding: 7px 16px; border-radius: 999px; color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 600; white-space: nowrap; }
  .tabs a[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
  .q-item { margin-bottom: 14px; }
  .q-item h3 { margin: 6px 0 2px; font-size: 1.05rem; }

  }

</header>

<main class="wrap" id="app" tabindex="-1"></main>

<footer class="foot wrap">
  <p>Truyện do fan viết, thuộc về tác giả của từng truyện. Nhân vật dựa trên người thật: viết với sự tôn trọng nhé.</p>
  <p><a href="../">← Về trang video LenaMiu Vietsub</a></p>
</footer>

<script>
(() => {
  'use strict';

  /* ================= cấu hình ================= */
  const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  // Máy chủ fanfic (thư mục worker-fic/). Mở trang trong máy thì tự dùng máy chủ chạy trong máy.
  const API = LOCAL ? 'http://' + location.hostname + ':8789' : 'https://lenamiu-fic.dangthithuynhi2000.workers.dev';
  // Khoá công khai Cloudflare Turnstile (chống tạo tài khoản ảo). Trong máy dùng khoá thử của Cloudflare (luôn qua).
  const TURNSTILE_KEY = LOCAL ? '1x00000000000000000000AA' : '';
  const PASS_ITER = 150000;           // số vòng băm mật khẩu trong trình duyệt (đổi là mọi người phải đặt lại mật khẩu)
  const MAX_BODY = 100000;
  const RATING = { all: 'Mọi lứa tuổi', 13: '13+', 16: '16+', 18: '18+' };
  const STATUS = {
    draft: ['Nháp', ''], pending: ['Chờ duyệt', 'b-wait'], published: ['Đã đăng', 'b-ok'],
    rejected: ['Bị từ chối', 'b-no'], hidden: ['Bị ẩn', 'b-no']
  };
  const ROLE = { admin: 'Người duyệt', trusted: 'Tin cậy', user: 'Thành viên' };

  const app = document.getElementById('app');
  const nav = document.getElementById('nav');
  const bar = document.getElementById('progress');

  /* ================= tiện ích ================= */
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* trình duyệt chặn lưu */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* bỏ qua */ } },
    json(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
    put(k, v) { this.set(k, JSON.stringify(v)); }
  };

  // Tạo phần tử an toàn: chữ của người dùng luôn được gắn dạng chữ (textContent), không bao giờ thành HTML.
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const k in props) {
        const v = props[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'value' || k === 'checked') el[k] = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : String(v));
      }
    }
    return addKids(el, kids);
  }
  // Gắn con vào phần tử: bỏ qua null / false / '' (chỗ "có thì hiện, không thì thôi"), mảng lồng nhau thì trải ra
  function addKids(el, kids) {
    for (const kid of [kids].flat(Infinity)) {
      if (kid != null && kid !== false && kid !== '') el.append(kid instanceof Node ? kid : String(kid));
    }
    return el;
  }
  const fill = (el, ...kids) => { el.replaceChildren(); return addKids(el, kids); };
  const fmt = (n) => Number(n || 0).toLocaleString('vi-VN');
  function ago(iso) {
    const t = Date.parse(iso || '');
    if (!t) return '';
    const s = (Date.now() - t) / 1000;
    if (s < 60) return 'vừa xong';
    if (s < 3600) return Math.floor(s / 60) + ' phút trước';
    if (s < 86400) return Math.floor(s / 3600) + ' giờ trước';
    if (s < 86400 * 7) return Math.floor(s / 86400) + ' ngày trước';
    return dateVN(iso);
  }
  function dateVN(iso) {
    const t = Date.parse(iso || '');
    return t ? new Date(t).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
  }
  const timeEl = (iso) => h('time', { datetime: iso, title: iso ? new Date(iso).toLocaleString('vi-VN') : null }, ago(iso));
  function norm(s) {
    return String(s || '').normalize('NFD').replace(/\p{M}/gu, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  }
  const badge = (st) => h('span', { class: 'badge ' + (STATUS[st] || ['', ''])[1] }, (STATUS[st] || [st])[0]);
  const ratingBadge = (r) => (r && r !== 'all' ? h('span', { class: 'badge' + (r === '18' ? ' b-no' : '') }, RATING[r]) : null);

  let toastTimer;
  function toast(msg, bad) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = h('div', { class: 'toast' + (bad ? ' bad' : ''), role: bad ? 'alert' : 'status' }, msg);
    document.body.append(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), bad ? 5000 : 3000);
  }

  function visitorId() {
    let id = ls.get('lm_vid');                    // dùng chung mã người xem với trang video
    if (!/^[a-f0-9]{16,32}$/.test(id || '')) {
      const a = new Uint8Array(12);
      crypto.getRandomValues(a);
      id = [...a].map((b) => b.toString(16).padStart(2, '0')).join('');
      ls.set('lm_vid', id);
    }
    return id;
  }

  /* ================= máy chủ + tài khoản ================= */
  let token = ls.get('fic_token') || '';
  let me = token ? ls.json('fic_me', null) : null;
  let queue = 0;

  async function api(path, { method = 'GET', body } = {}) {
    const headers = {};
    if (token) headers.Authorization = 'Bearer ' + token;
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    let r;
    try {
      r = await fetch(API + path, { method, headers, cache: 'no-store',
                                    body: body === undefined ? undefined : JSON.stringify(body) });
    } catch (e) {
      throw new Error('Không kết nối được máy chủ, bạn kiểm tra mạng rồi thử lại nhé.');
    }
    let d = {};
    try { d = await r.json(); } catch (e) { /* không phải JSON */ }
    if (r.status === 401 && token && !path.startsWith('/auth/login')) {
      setSession(null);
      const e = new Error('Phiên đăng nhập đã hết, bạn đăng nhập lại nhé.');
      e.status = 401;
      throw e;
    }
    if (!r.ok) {
      const e = new Error(d.error || 'Có lỗi xảy ra (' + r.status + '), bạn thử lại nhé.');
      e.status = r.status;
      throw e;
    }
    return d;
  }

  function setSession(t, user) {
    token = t || '';
    me = token ? user : null;
    if (token) { ls.set('fic_token', token); ls.put('fic_me', me); } else { ls.del('fic_token'); ls.del('fic_me'); queue = 0; }
    renderNav();
  }
  async function loadMe() {
    if (!token) return;
    try {
      const d = await api('/auth/me');
      if (d.user) { me = d.user; queue = d.queue || 0; ls.put('fic_me', me); } else setSession(null);
    } catch (e) { /* mất mạng: tạm dùng thông tin đã lưu */ }
    renderNav();
  }
  // Mật khẩu được băm ngay trong trình duyệt: máy chủ không bao giờ nhận mật khẩu thật.
  async function passHash(username, password) {
    if (!crypto.subtle) throw new Error('Trình duyệt này không hỗ trợ đăng nhập an toàn, bạn thử trình duyệt khác nhé.');
    const te = new TextEncoder();
    const key = await crypto.subtle.importKey('raw', te.encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: te.encode('lenamiu-fic:' + username), iterations: PASS_ITER }, key, 256);
    return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  const canPublish = () => me && (me.role === 'admin' || me.role === 'trusted');

  function renderNav() {
    const items = [h('a', { class: 'nav-a hide-sm', href: '../' }, '🎬 Video')];
    if (me) {
      // nút đăng truyện chỉ hiện khi đã đăng nhập
      items.push(h('a', { class: 'nav-a', href: '#/viet', title: 'Đăng truyện', 'aria-label': 'Đăng truyện' },
        '✍️', h('span', { class: 'hide-sm' }, 'Đăng truyện')));
      const list = h('div', { class: 'menu-list' },
        h('a', { href: '#/cua-toi' }, '📚 Truyện của tôi'),
        me.role === 'admin' ? h('a', { href: '#/duyet' }, '🛡️ Duyệt truyện', queue ? h('span', { class: 'dot' }, queue) : null) : null,
        h('a', { href: '#/tai-khoan' }, '⚙️ Tài khoản'),
        h('button', { type: 'button', onclick: logout }, '↩ Đăng xuất'));
      items.push(h('details', { class: 'menu' },
        h('summary', { class: 'nav-a strong', 'aria-label': 'Tài khoản của ' + me.name },
          h('span', { class: 'me-name' }, me.name), me.role === 'admin' && queue ? h('span', { class: 'dot' }, queue) : null),
        list));
    } else {
      items.push(h('a', { class: 'nav-a strong', href: '#/dang-nhap' }, 'Đăng nhập'));
    }
    nav.replaceChildren(...items);
  }
  async function logout() {
    try { await api('/auth/logout', { method: 'POST' }); } catch (e) { /* vẫn đăng xuất trong máy */ }
    setSession(null);
    toast('Đã đăng xuất.');
    if (parseHash().path === '/') render(); else go('/');   // đang ở trang chủ thì vẽ lại cho ẩn nút đăng truyện
  }
  document.addEventListener('click', (e) => {
    document.querySelectorAll('details.menu[open]').forEach((d) => { if (!d.contains(e.target) || e.target.closest('a')) d.open = false; });
  });

  /* ================= định dạng chữ truyện ================= */
  // Nội dung chương lưu dạng HTML rút gọn, chỉ gồm vài thẻ:
  //   khối:  <p> đoạn   <h3> tiêu đề nhỏ   <blockquote> trích dẫn   <hr> chuyển cảnh   (class "c" căn giữa, "r" căn phải)
  //   chữ:   <strong> đậm   <em> nghiêng   <u> gạch chân   <s> gạch ngang   <br> xuống dòng   (lồng vào nhau thoải mái)
  // Mọi nội dung (lưu trên máy chủ, dán từ Google Docs / Word, ô soạn thảo) đều qua bộ lọc walkRich: đọc bằng DOMParser
  // (không chạy script, không tải ảnh), chỉ lấy chữ + các định dạng trên rồi DỰNG LẠI phần tử mới. HTML gốc không bao giờ
  // được gắn thẳng vào trang.
  const F = { b: 1, i: 2, u: 4, s: 8 };
  const SKIP = /^(SCRIPT|STYLE|HEAD|TITLE|META|LINK|TEMPLATE|NOSCRIPT|IFRAME|OBJECT|EMBED|SVG|MATH|IMG|PICTURE|VIDEO|AUDIO|CANVAS|BUTTON|INPUT|SELECT|TEXTAREA)$/;
  const BLOCK = /^(P|DIV|H[1-6]|LI|PRE|SECTION|ARTICLE|HEADER|FOOTER|ASIDE|TR|DT|DD|FIGCAPTION|ADDRESS|CENTER)$/;
  const isRichHtml = (s) => /^\s*<(p|h3|blockquote|hr)[\s>/]/i.test(s);
  const countWords = (s) => { const t = String(s || '').trim(); return t ? t.split(/\s+/).length : 0; };

  function walkRich(root) {
    const blocks = [];
    let cur = null;
    const open = (type, align) => { cur = { type, align: align || '', runs: [] }; blocks.push(cur); return cur; };
    const alignOf = (el, inherit) => {
      const a = String((el.style && el.style.textAlign) || (el.getAttribute && el.getAttribute('align')) || '').toLowerCase();
      if (a === 'center' || el.tagName === 'CENTER' || (el.classList && el.classList.contains('c'))) return 'c';
      if (a === 'right' || a === 'end' || (el.classList && el.classList.contains('r'))) return 'r';
      if (a === 'left' || a === 'start' || a === 'justify') return '';
      return inherit || '';
    };
    const fmtOf = (el, f) => {
      const t = el.tagName, st = el.style || {};
      if (t === 'B' || t === 'STRONG') f |= F.b;
      if (t === 'I' || t === 'EM' || t === 'CITE') f |= F.i;
      if (t === 'U' || t === 'INS') f |= F.u;
      if (t === 'S' || t === 'STRIKE' || t === 'DEL') f |= F.s;
      const fw = st.fontWeight;                 // Google Docs bọc cả bài trong <b style="font-weight:normal">
      if (fw) f = (fw === 'bold' || fw === 'bolder' || Number(fw) >= 600) ? f | F.b : f & ~F.b;
      const fs = st.fontStyle;
      if (fs) f = (fs === 'italic' || fs === 'oblique') ? f | F.i : f & ~F.i;
      const td = String(st.textDecorationLine || st.textDecoration || '');
      if (td.includes('underline')) f |= F.u;
      if (td.includes('line-through')) f |= F.s;
      return f;
    };
    (function walk(node, f, quote, align) {
      if (node.nodeType === 3) {
        const t = node.nodeValue.replace(/\s+/g, ' ');
        if (!t || (!cur && !t.trim())) return;
        (cur || open(quote ? 'blockquote' : 'p', align)).runs.push({ t, f });
        return;
      }
      if (node.nodeType !== 1 && node.nodeType !== 11) return;          // 11 = DocumentFragment
      const tag = node.tagName || '';
      if (SKIP.test(tag)) return;
      if (tag === 'BR') { (cur || open(quote ? 'blockquote' : 'p', align)).runs.push({ br: true }); return; }
      if (tag === 'HR') { cur = null; blocks.push({ type: 'hr' }); return; }
      const nf = node.nodeType === 1 ? fmtOf(node, f) : f;
      const na = node.nodeType === 1 ? alignOf(node, align) : align;
      if (tag === 'BLOCKQUOTE' && !quote) {
        cur = null; open('blockquote', na);
        for (const k of node.childNodes) walk(k, nf, true, na);
        cur = null;
        return;
      }
      if (BLOCK.test(tag) || tag === 'BLOCKQUOTE') {
        if (quote) {
          // đoạn nằm trong khung trích dẫn: thành dòng mới trong cùng khung
          if (cur && cur.runs.length && !cur.runs[cur.runs.length - 1].br) cur.runs.push({ br: true });
          for (const k of node.childNodes) walk(k, nf, true, na);
          return;
        }
        cur = null; open(/^H[1-6]$/.test(tag) ? 'h3' : 'p', na);
        for (const k of node.childNodes) walk(k, nf, false, na);
        cur = null;
        return;
      }
      for (const k of node.childNodes) walk(k, nf, quote, align);
    })(root, 0, false, '');

    // dọn: bỏ khoảng trắng thừa đầu/cuối dòng, bỏ khối rỗng, gộp các dòng chuyển cảnh liền nhau
    const out = [];
    for (const b of blocks) {
      if (b.type === 'hr') { if (out.length && out[out.length - 1].type !== 'hr') out.push(b); continue; }
      const runs = b.runs;
      for (let k = 0; k < runs.length; k++) {
        if (runs[k].br) continue;
        if (k === 0 || runs[k - 1].br) runs[k].t = runs[k].t.replace(/^\s+/, '');
        if (k === runs.length - 1 || runs[k + 1].br) runs[k].t = runs[k].t.replace(/\s+$/, '');
      }
      b.runs = runs.filter((r) => r.br || r.t);
      while (b.runs.length && b.runs[0].br) b.runs.shift();
      while (b.runs.length && b.runs[b.runs.length - 1].br) b.runs.pop();
      if (b.runs.some((r) => r.t && r.t.trim())) out.push(b);
    }
    while (out.length && out[out.length - 1].type === 'hr') out.pop();
    while (out.length && out[0].type === 'hr') out.shift();
    return out;
  }
  const richFromHtml = (html) => walkRich(new DOMParser().parseFromString(String(html || ''), 'text/html').body);
  // Nội dung đã lưu: dạng HTML rút gọn, hoặc chữ thường (mỗi dòng một đoạn, có thể dùng ** * __ ~~)
  const richFromStored = (s) => (isRichHtml(String(s || '')) ? richFromHtml(s) : walkRich(legacyNodes(s)));

  function buildInline(runs) {
    const frag = document.createDocumentFragment();
    const merged = [];
    for (const r of runs) {
      const last = merged[merged.length - 1];
      if (r.t != null && last && last.t != null && last.f === r.f) last.t += r.t; else merged.push(Object.assign({}, r));
    }
    for (const r of merged) {
      if (r.br) { frag.append(document.createElement('br')); continue; }
      let n = document.createTextNode(r.t);
      if (r.f & F.s) n = h('s', null, n);
      if (r.f & F.u) n = h('u', null, n);
      if (r.f & F.i) n = h('em', null, n);
      if (r.f & F.b) n = h('strong', null, n);
      frag.append(n);
    }
    return frag;
  }
  function richNodes(blocks) {
    const frag = document.createDocumentFragment();
    for (const b of blocks) frag.append(b.type === 'hr' ? h('hr', { class: 'scene' }) : h(b.type, { class: b.align || null }, buildInline(b.runs)));
    return frag;
  }
  const renderBody = (stored) => richNodes(richFromStored(stored));                 // trang đọc, trang duyệt
  function richHtml(blocks) { const d = document.createElement('div'); d.append(richNodes(blocks)); return d.innerHTML; }   // để lưu
  const blocksWords = (blocks) => blocks.reduce((n, b) => n + (b.runs ? countWords(b.runs.map((r) => r.t || ' ').join('')) : 0), 0);
  function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // Chữ thường kiểu cũ: mỗi dòng một đoạn; dòng chỉ có *** (hoặc --- , ~~~) là chuyển cảnh;
  // **đậm** *nghiêng* __gạch chân__ ~~gạch ngang~~, lồng nhau được: *nghiêng **đậm** nghiêng*
  const SCENE = /^(\*\s*){3,}$|^-{3,}$|^~{3,}$|^[✻❀✿]+$/;
  const MARKS = ['***', '**', '__', '~~', '*'];
  function legacyNodes(text) {
    const frag = document.createDocumentFragment();
    for (const raw of String(text || '').split('\n')) {
      const line = raw.trim();
      if (line) frag.append(SCENE.test(line) ? h('hr') : h('p', null, legacyInline(line)));
    }
    return frag;
  }
  function findClose(s, mk, from) {
    let j = from;
    while ((j = s.indexOf(mk, j)) >= 0) {
      if (mk === '*' && s[j + 1] === '*') {                       // gặp **...** bên trong *...*: nhảy qua cả cặp
        const c2 = s.indexOf('**', j + 2);
        if (c2 < 0) return -1;
        j = c2 + 2;
        continue;
      }
      if (j > from && !/\s/.test(s[j - 1])) return j;
      j += mk.length;
    }
    return -1;
  }
  function legacyInline(s) {
    const out = [];
    let buf = '', i = 0;
    while (i < s.length) {
      const mk = MARKS.find((m) => s.startsWith(m, i) && s[i + m.length] && !/\s/.test(s[i + m.length]));
      const end = mk ? findClose(s, mk, i + mk.length) : -1;
      if (end > 0) {
        if (buf) { out.push(buf); buf = ''; }
        const inner = legacyInline(s.slice(i + mk.length, end));
        out.push(mk === '***' ? h('strong', null, h('em', null, inner))
          : h({ '**': 'strong', '*': 'em', '__': 'u', '~~': 's' }[mk], null, inner));
        i = end + mk.length;
        continue;
      }
      buf += s[i++];
    }
    if (buf) out.push(buf);
    return out;
  }

  /* ================= cài đặt đọc ================= */
  const RD_DEFAULT = { size: 19, font: 'serif', lh: 1.8, theme: 'auto' };
  let rd = Object.assign({}, RD_DEFAULT, ls.json('fic_reader', {}));
  let reading = false;
  function applyReader() {
    const root = document.documentElement;
    root.style.setProperty('--rd-size', rd.size + 'px');
    root.style.setProperty('--rd-lh', String(rd.lh));
    root.style.setProperty('--rd-font', rd.font === 'serif' ? '"Lora", Georgia, "Times New Roman", serif'
                                                            : '"Be Vietnam Pro", system-ui, -apple-system, sans-serif');
    for (const t of ['light', 'paper', 'dark']) root.classList.toggle('rd-' + t, reading && rd.theme === t);
  }
  function setReading(on) { reading = on; applyReader(); bar.hidden = !on; if (!on) bar.style.width = '0'; }
  function saveReader() { ls.put('fic_reader', rd); applyReader(); }

  const progressAll = () => ls.json('fic_progress', {});
  function saveProgress(storyId, data) {
    const p = progressAll();
    p[storyId] = Object.assign({}, p[storyId], data, { at: Date.now() });
    const keys = Object.keys(p).sort((a, b) => p[b].at - p[a].at);
    for (const k of keys.slice(60)) delete p[k];      // nhớ tối đa 60 truyện
    ls.put('fic_progress', p);
  }
  const ageOk = (r) => r !== '18' || ls.get('fic_18') === '1';
  function ageGate(onYes) {
    return h('div', { class: 'gate card' },
      h('h2', null, 'Truyện dành cho người từ 18 tuổi'),
      h('p', { class: 'muted' }, 'Tác giả gắn nhãn 18+ cho truyện này. Bạn đã đủ 18 tuổi chưa?'),
      h('div', { class: 'row', style: 'justify-content:center' },
        h('button', { type: 'button', class: 'btn primary', onclick: () => { ls.set('fic_18', '1'); onYes(); } }, 'Mình đủ 18 tuổi'),
        h('a', { class: 'btn', href: '#/' }, 'Quay lại')));
  }

  /* ================= định tuyến ================= */
  let seq = 0;
  let cleanups = [];
  function go(path) { location.hash = '#' + path; }
  function parseHash() {
    const raw = location.hash.replace(/^#/, '');
    const i = raw.indexOf('?');
    const path = (i < 0 ? raw : raw.slice(0, i)) || '/';
    return { path, q: new URLSearchParams(i < 0 ? '' : raw.slice(i + 1)) };
  }
  function safeNext(v) { return /^\/[a-z0-9\-/]*$/i.test(v || '') ? v : null; }
  function needLogin() {
    if (me) return false;
    go('/dang-nhap?next=' + encodeURIComponent(parseHash().path));
    return true;
  }
  const loadingBox = () => h('div', { class: 'loading' }, 'Đang tải…');
  function errorBox(e) {
    return h('div', { class: 'empty' }, h('p', null, e.message || 'Có lỗi xảy ra.'),
      h('div', { class: 'row', style: 'justify-content:center' },
        h('button', { type: 'button', class: 'btn', onclick: render }, 'Thử lại'), h('a', { class: 'btn', href: '#/' }, 'Về trang truyện')));
  }

  const ROUTES = [
    [/^\/$/, viewHome],
    [/^\/truyen\/(\d+)$/, viewStory],
    [/^\/doc\/(\d+)$/, viewChapter],
    [/^\/dang-nhap$/, viewLogin],
    [/^\/dang-ky$/, viewRegister],
    [/^\/cua-toi$/, viewMine],
    [/^\/viet$/, viewStoryForm],
    [/^\/truyen\/(\d+)\/sua$/, viewStoryForm],
    [/^\/truyen\/(\d+)\/chuong-moi$/, viewEditor],
    [/^\/chuong\/(\d+)\/sua$/, viewEditor],
    [/^\/duyet$/, viewAdmin],
    [/^\/tai-khoan$/, viewAccount]
  ];

  async function render() {
    const my = ++seq;
    cleanups.forEach((f) => f());
    cleanups = [];
    const { path, q } = parseHash();
    setReading(false);
    document.querySelectorAll('details.menu[open]').forEach((d) => { d.open = false; });
    document.title = 'LenaMiu Fanfic';
    const ctx = {
      q, alive: () => my === seq,
      mount: (...nodes) => { if (my === seq) fill(app, nodes); },
      title: (t) => { if (my === seq) document.title = t + ' · LenaMiu Fanfic'; }
    };
    const found = ROUTES.find(([re]) => re.test(path));
    if (!found) { app.replaceChildren(errorBox(new Error('Không có trang này.'))); return; }
    app.replaceChildren(loadingBox());
    if (!q.has('tiep')) window.scrollTo(0, 0);
    try {
      await found[1](ctx, ...found[0].exec(path).slice(1).map(Number));
    } catch (e) {
      if (ctx.alive()) app.replaceChildren(errorBox(e));
    }
  }
  window.addEventListener('hashchange', render);

  /* ================= trang chủ: danh sách truyện ================= */
  let listCache = null;
  async function viewHome(ctx) {
    if (!listCache || Date.now() - listCache.at > 30000) listCache = { at: Date.now(), data: (await api('/stories')).stories };
    const stories = listCache.data;
    const author = ctx.q.get('tac-gia');
    const state = { text: '', tag: ctx.q.get('the') || '', sort: 'new', done: false };

    const tagCount = new Map();
    for (const s of stories) for (const t of s.tags) tagCount.set(t, (tagCount.get(t) || 0) + 1);
    const topTags = [...tagCount.entries()].sort((a, b) => b[1] - a[1]).slice(0, 14).map((x) => x[0]);

    const list = h('div', { class: 'stories' });
    const count = h('p', { class: 'muted small', 'aria-live': 'polite' });
    const search = h('input', { type: 'search', placeholder: 'Tìm tên truyện, tác giả, thẻ…', 'aria-label': 'Tìm truyện',
                                oninput: () => { state.text = search.value; draw(); } });
    const sort = h('select', { 'aria-label': 'Sắp xếp', onchange: () => { state.sort = sort.value; draw(); } },
      h('option', { value: 'new' }, 'Mới cập nhật'), h('option', { value: 'reads' }, 'Đọc nhiều'),
      h('option', { value: 'hearts' }, 'Nhiều tim'), h('option', { value: 'created' }, 'Truyện mới'));
    const tagBtns = topTags.map((t) => h('button', { type: 'button', class: 'tag', 'aria-pressed': String(state.tag === t),
      onclick: (e) => { state.tag = state.tag === t ? '' : t; tagBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.textContent === state.tag))); draw(); } }, t));
    const doneBtn = h('button', { type: 'button', class: 'tag', 'aria-pressed': 'false',
      onclick: () => { state.done = !state.done; doneBtn.setAttribute('aria-pressed', String(state.done)); draw(); } }, '✓ Đã hoàn');

    function draw() {
      const words = norm(state.text).split(/\s+/).filter(Boolean);
      let items = stories.filter((s) => {
        if (author && s.author.username !== author) return false;
        if (state.tag && !s.tags.includes(state.tag)) return false;
        if (state.done && !s.done) return false;
        if (!words.length) return true;
        const hay = norm([s.title, s.author.name, s.summary, s.tags.join(' ')].join(' '));
        return words.every((w) => hay.includes(w));
      });
      const key = { new: (s) => Date.parse(s.updated || s.created), reads: (s) => s.reads, hearts: (s) => s.hearts,
                    created: (s) => Date.parse(s.created) }[state.sort];
      items = items.slice().sort((a, b) => key(b) - key(a));
      list.replaceChildren(...items.map(storyCard));
      count.textContent = items.length === stories.length ? fmt(items.length) + ' truyện' : 'Tìm thấy ' + fmt(items.length) + ' truyện';
      if (!items.length) list.replaceChildren(h('div', { class: 'empty' }, stories.length ? 'Không có truyện nào khớp.' : ''));
    }

    // truyện đang đọc dở
    const prog = progressAll();
    const conts = stories.filter((s) => prog[s.id]).sort((a, b) => prog[b.id].at - prog[a.id].at).slice(0, 3).map((s) => {
      const p = prog[s.id];
      const left = s.chapters - (p.i + 1);
      return h('a', { class: 'cont', href: '#/doc/' + p.ch + '?tiep=1' },
        h('div', null, h('b', null, s.title), h('span', null, 'Đang đọc chương ' + (p.i + 1) + '/' + s.chapters + (left > 0 ? ' · còn ' + left + ' chương mới' : ''))),
        h('span', { class: 'btn sm primary' }, 'Đọc tiếp'));
    });

    const authorName = author && (stories.find((s) => s.author.username === author) || { author: { name: '@' + author } }).author.name;
    ctx.mount(
      author
        ? h('div', { class: 'hero' }, h('h1', null, 'Truyện của ' + authorName), h('p', null, h('a', { href: '#/' }, '← Xem tất cả truyện')))
        : h('div', { class: 'hero' },
            h('h1', null, 'Fanfic LenaMiu'),
            h('p', null, 'Truyện do fan viết về Lena và Miu'),
            me ? h('a', { class: 'btn primary', href: '#/viet' }, '✍️ Đăng truyện của bạn') : null),
      conts.length && !author ? [h('h2', { class: 'section-title' }, 'Đang đọc dở'), ...conts] : null,
      stories.length ? h('div', { class: 'tools' }, search, sort) : null,
      stories.length ? h('div', { class: 'tags filter-tags' }, doneBtn, tagBtns) : null,
      stories.length ? count : null,
      stories.length ? list : h('div', { class: 'empty card' },
        h('p', null, 'Chưa có truyện nào được đăng.'),
        me ? h('p', null, 'Bạn viết truyện đầu tiên cho fandom nha! 💗') : null,
        me ? h('a', { class: 'btn primary', href: '#/viet' }, 'Đăng truyện đầu tiên') : null));
    if (stories.length) draw();
  }
  function storyCard(s) {
    return h('a', { class: 'story', href: '#/truyen/' + s.id },
      h('h3', null, s.title),
      h('div', { class: 'row' }, h('span', { class: 'by' }, 'của ' + s.author.name), ratingBadge(s.rating),
        s.done ? h('span', { class: 'badge b-ok' }, 'Hoàn') : h('span', { class: 'badge' }, 'Đang viết')),
      s.summary ? h('p', { class: 'sum' }, s.summary) : null,
      s.tags.length ? h('div', { class: 'tags' }, s.tags.map((t) => h('span', { class: 'tag' }, t))) : null,
      h('div', { class: 'stats' },
        h('span', null, s.chapters + ' chương'), h('span', null, fmt(s.words) + ' chữ'),
        h('span', { title: 'Lượt đọc' }, '👁 ' + fmt(s.reads)), h('span', { title: 'Tim' }, '💗 ' + fmt(s.hearts)),
        h('span', null, 'cập nhật ' + ago(s.updated))));
  }

  /* ================= trang truyện ================= */
  async function viewStory(ctx, id) {
    const s = (await api('/stories/' + id)).story;
    if (!ctx.alive()) return;
    ctx.title(s.title);
    if (!ageOk(s.rating)) return ctx.mount(ageGate(render));
    const p = progressAll()[s.id];
    const first = s.chapters[0];
    const share = async () => {
      const url = 'https://lenamiu.xyz/fanfic/#/truyen/' + s.id;
      try {
        if (navigator.share) await navigator.share({ title: s.title, url });
        else { await navigator.clipboard.writeText(url); toast('Đã chép link truyện.'); }
      } catch (e) { /* người dùng huỷ */ }
    };
    const mine = me && (me.id === s.authorId || me.role === 'admin');
    ctx.mount(h('article', { class: 'narrow', style: 'margin:0 auto' },
      h('div', { class: 'story-head' },
        h('a', { href: '#/', class: 'small' }, '← Tất cả truyện'),
        h('h1', null, s.title),
        h('div', { class: 'row' },
          h('span', null, 'của ', h('a', { href: '#/?tac-gia=' + encodeURIComponent(s.author.username) }, s.author.name)),
          ratingBadge(s.rating), s.done ? h('span', { class: 'badge b-ok' }, 'Hoàn') : h('span', { class: 'badge' }, 'Đang viết'))),
      s.summary ? h('p', { class: 'summary' }, s.summary) : null,
      s.tags.length ? h('div', { class: 'tags', style: 'margin-bottom:14px' },
        s.tags.map((t) => h('a', { class: 'tag', href: '#/?the=' + encodeURIComponent(t) }, t))) : null,
      h('div', { class: 'stats', style: 'margin-bottom:18px' },
        h('span', null, s.chapters.length + ' chương'), h('span', null, fmt(s.words) + ' chữ'),
        h('span', null, '👁 ' + fmt(s.reads) + ' lượt đọc'), h('span', null, '💗 ' + fmt(s.hearts) + ' tim'),
        h('span', null, 'cập nhật ' + ago(s.updated))),
      h('div', { class: 'row', style: 'margin-bottom:24px' },
        p && s.chapters.some((c) => c.id === p.ch)
          ? h('a', { class: 'btn primary', href: '#/doc/' + p.ch + '?tiep=1' }, 'Đọc tiếp chương ' + (s.chapters.findIndex((c) => c.id === p.ch) + 1))
          : h('a', { class: 'btn primary', href: '#/doc/' + first.id }, 'Đọc từ đầu'),
        p ? h('a', { class: 'btn', href: '#/doc/' + first.id }, 'Đọc lại từ đầu') : null,

      h('h2', { class: 'section-title' }, 'Mục lục'),
      h('ol', { class: 'toc' }, s.chapters.map((c, i) => h('li', null,
        h('a', { href: '#/doc/' + c.id, class: p && p.ch === c.id ? 'now' : null },
          h('span', null, 'Chương ' + (i + 1) + (c.title ? ': ' + c.title : '')),
          h('small', null, '💗 ' + fmt(c.hearts) + ' · ' + dateVN(c.published))))))));

  /* ================= trang đọc chương ================= */
  async function viewChapter(ctx, id) {
    const ch = (await api('/chapters/' + id + '?u=' + visitorId())).chapter;
    if (!ctx.alive()) return;
    const s = ch.story;
    const show = () => {
      ctx.title((ch.title || 'Chương ' + (ch.index + 1)) + ' – ' + s.title);
      setReading(true);
      const prev = ch.list[ch.index - 1], next = ch.list[ch.index + 1];
      const label = (c, i) => 'Chương ' + (i + 1) + (c.title ? ': ' + c.title : '');

      // nút "Aa": cài đặt đọc
      const panel = h('div', { class: 'rd-panel', hidden: true });
      const seg = (key, opts) => h('div', { class: 'seg' }, opts.map(([v, text]) => h('button', {
        type: 'button', 'aria-pressed': String(rd[key] === v),
        onclick: (e) => { rd[key] = v; saveReader(); e.currentTarget.parentNode.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === e.currentTarget))); }
      }, text)));
      const sizeOut = h('span', { style: 'flex:1;text-align:center;font-weight:600' }, rd.size + 'px');
      const size = (d) => { rd.size = Math.min(28, Math.max(14, rd.size + d)); sizeOut.textContent = rd.size + 'px'; saveReader(); };
      panel.append(
        h('div', { class: 'lbl' }, 'Cỡ chữ'),
        h('div', { class: 'seg', style: 'align-items:center' },
          h('button', { type: 'button', 'aria-label': 'Chữ nhỏ hơn', onclick: () => size(-1) }, 'A−'), sizeOut,
          h('button', { type: 'button', 'aria-label': 'Chữ to hơn', onclick: () => size(1) }, 'A+')),
        h('div', { class: 'lbl' }, 'Kiểu chữ'), seg('font', [['serif', 'Có chân'], ['sans', 'Không chân']]),
        h('div', { class: 'lbl' }, 'Giãn dòng'), seg('lh', [[1.6, 'Hẹp'], [1.8, 'Vừa'], [2.05, 'Rộng']]),
        h('div', { class: 'lbl' }, 'Màu nền'), seg('theme', [['auto', 'Theo máy'], ['light', 'Sáng'], ['paper', 'Giấy'], ['dark', 'Tối']]));
      const aa = h('button', { type: 'button', class: 'btn sm', 'aria-expanded': 'false', 'aria-label': 'Cài đặt đọc',
        onclick: () => { panel.hidden = !panel.hidden; aa.setAttribute('aria-expanded', String(!panel.hidden)); } }, 'Aa');
      const closePanel = (e) => { if (!panel.hidden && !panel.contains(e.target) && e.target !== aa) { panel.hidden = true; aa.setAttribute('aria-expanded', 'false'); } };
      document.addEventListener('click', closePanel);
      cleanups.push(() => document.removeEventListener('click', closePanel));

      // tim
      const heart = h('button', { type: 'button', class: 'heart', 'aria-pressed': String(ch.hearted) });
      const paintHeart = () => {
        heart.setAttribute('aria-pressed', String(ch.hearted));
        heart.replaceChildren(ch.hearted ? '💗 Đã thả tim' : '🤍 Thả tim', h('span', { style: 'opacity:.8' }, '· ' + fmt(ch.hearts)));
      };
      heart.addEventListener('click', async () => {
        const on = !ch.hearted;
        ch.hearted = on; ch.hearts = Math.max(0, ch.hearts + (on ? 1 : -1));
        paintHeart();
        if (on) { heart.classList.remove('pop'); void heart.offsetWidth; heart.classList.add('pop'); }
        try {
          const d = await api('/chapters/' + ch.id + '/heart', { method: 'POST', body: { u: visitorId(), on } });
          ch.hearted = d.hearted; ch.hearts = d.hearts;
        } catch (e) { ch.hearted = !on; ch.hearts = Math.max(0, ch.hearts + (on ? -1 : 1)); toast(e.message, true); }
        paintHeart();
      });
      paintHeart();

      const select = h('select', { class: 'ch-select', 'aria-label': 'Chọn chương', onchange: () => go('/doc/' + select.value) },
        ch.list.map((c, i) => h('option', { value: c.id, selected: c.id === ch.id }, label(c, i))));
      const prose = h('div', { class: 'prose' }, renderBody(ch.body));
      const mine = me && (me.id === s.authorId || me.role === 'admin');

      ctx.mount(h('div', { class: 'reader' },
        h('div', { class: 'rd-bar' },
          h('a', { href: '#/truyen/' + s.id }, '← ' + s.title),
          h('div', { class: 'row', style: 'position:relative;flex:none' },
            mine ? h('a', { class: 'btn sm', href: '#/chuong/' + ch.id + '/sua' }, 'Sửa') : null, aa, panel)),
        h('header', { class: 'ch-head' },
          h('p', { class: 'kicker' }, 'Chương ' + (ch.index + 1) + ' / ' + ch.list.length),
          h('h1', null, ch.title || s.title),
          h('p', { class: 'muted small', style: 'margin:0' }, s.author.name + ' · ' + fmt(ch.words) + ' chữ · ' + dateVN(ch.published))),
        prose,
        h('div', { class: 'end-box' },
          h('p', { class: 'muted small', style: 'margin:0 0 12px' }, ch.hearted ? 'Cảm ơn bạn đã thả tim cho chương này 💗' : 'Thích chương này thì thả tim cho tác giả nha'),
          heart,
          h('div', { class: 'ch-nav' },
            prev ? h('a', { class: 'btn', href: '#/doc/' + prev.id }, '← Chương trước') : null,
            next ? h('a', { class: 'btn primary next', href: '#/doc/' + next.id }, 'Chương sau →')
                 : h('a', { class: 'btn next', href: '#/truyen/' + s.id }, 'Về mục lục')),
          ch.list.length > 1 ? select : null,
          !next ? h('p', { class: 'muted small', style: 'margin:8px 0 0' }, 'Bạn đã đọc tới chương mới nhất rồi.') : null),
        commentsBox(ch)));

      // thanh tiến độ + nhớ chỗ đang đọc
      const saved = progressAll()[s.id];
      let ticking = false, lastSave = 0;
      const ratio = () => {
        const r = prose.getBoundingClientRect();
        const span = r.height - window.innerHeight * 0.6;
        return span <= 0 ? 1 : Math.min(1, Math.max(0, -r.top / span));
      };
      const onScroll = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          ticking = false;
          const k = ratio();
          bar.style.width = (k * 100).toFixed(1) + '%';
          if (Date.now() - lastSave > 800) { lastSave = Date.now(); saveProgress(s.id, { ch: ch.id, i: ch.index, pos: k }); }
        });
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      cleanups.push(() => window.removeEventListener('scroll', onScroll));
      saveProgress(s.id, { ch: ch.id, i: ch.index, pos: saved && saved.ch === ch.id ? saved.pos : 0 });
      if (ctx.q.has('tiep') && saved && saved.ch === ch.id && saved.pos > 0.02) {
        const jump = () => {
          const r = prose.getBoundingClientRect();
          window.scrollTo(0, window.scrollY + r.top + saved.pos * (r.height - window.innerHeight * 0.6));
        };
        requestAnimationFrame(jump);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (ctx.alive()) jump(); });
      } else window.scrollTo(0, 0);
      onScroll();

      // phím ← → để đổi chương
      const onKey = (e) => {
        if (e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
        if (e.key === 'ArrowLeft' && prev) go('/doc/' + prev.id);
        if (e.key === 'ArrowRight' && next) go('/doc/' + next.id);
      };
      document.addEventListener('keydown', onKey);
      cleanups.push(() => document.removeEventListener('keydown', onKey));

      countRead(s.id);
    };
    if (!ageOk(s.rating)) return ctx.mount(ageGate(show));
    show();
  }
  // 1 lượt đọc / truyện / ngày; hôm nay đã gửi rồi thì thôi khỏi gọi máy chủ
  function countRead(storyId) {
    const day = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
    let done = ls.json('fic_reads', null);
    if (!done || done.d !== day || !Array.isArray(done.s)) done = { d: day, s: [] };
    if (done.s.includes(storyId)) return;
    done.s.push(storyId);
    ls.put('fic_reads', done);
    api('/read', { method: 'POST', body: { story: storyId, u: visitorId() } }).catch(() => {});
  }

  let tsLoading = null;
  function loadTurnstile() {
    if (!tsLoading) {
      tsLoading = new Promise((res, rej) => {
        const sc = document.createElement('script');
        sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        sc.async = true;
        sc.onload = () => res(window.turnstile);
        sc.onerror = () => { tsLoading = null; rej(new Error('Không tải được bước kiểm tra chống spam.')); };
        document.head.append(sc);
      });
    }
    return tsLoading;
  }

  function viewRegister(ctx) {
    const next = safeNext(ctx.q.get('next')) || '/cua-toi';
    if (me) return go(next);
    ctx.title('Đăng ký');
    const user = h('input', { type: 'text', autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false', required: true,
                              minlength: 3, maxlength: 20, pattern: '[a-z0-9_]{3,20}' });
    user.addEventListener('input', () => {
      const v = norm(user.value).replace(/[^a-z0-9_]/g, '');
      if (v !== user.value) user.value = v;
    });
    const name = h('input', { type: 'text', autocomplete: 'nickname', required: true, minlength: 2, maxlength: 40 });
    const pass = h('input', { type: 'password', autocomplete: 'new-password', required: true, minlength: 8 });
    const pass2 = h('input', { type: 'password', autocomplete: 'new-password', required: true, minlength: 8 });
    const agree = h('input', { type: 'checkbox', required: true });
    const err = h('p', { class: 'err', role: 'alert' });

    const tsBox = h('div', { style: 'margin-bottom:12px;min-height:65px' });
    let tsToken = '', tsId = null;
    if (TURNSTILE_KEY) {
      loadTurnstile().then((ts) => {
        if (!ctx.alive()) return;
        tsId = ts.render(tsBox, { sitekey: TURNSTILE_KEY, language: 'vi', callback: (t) => { tsToken = t; },
                                  'expired-callback': () => { tsToken = ''; } });
      }).catch((e) => { tsBox.textContent = e.message; });
    } else tsBox.hidden = true;

    ctx.mount(h('div', { class: 'form' }, h('div', { class: 'card' },

        if (TURNSTILE_KEY && !tsToken) { err.textContent = 'Bạn đợi bước kiểm tra chống spam xong đã nhé.'; return; }
        btn.disabled = true;
        try {
          const u = user.value.trim().toLowerCase();
          const d = await api('/auth/register', { method: 'POST',
            body: { username: u, name: name.value, pass: await passHash(u, pass.value), ts: tsToken } });
          setSession(d.token, d.user);
          toast('Chào mừng ' + d.user.name + ' 💗');
          go(next);
