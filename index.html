<link rel="stylesheet" href="site.css">
<style>
  :root {
    color-scheme: light;
    --bg: #faf7f6; --surface: #ffffff; --surface-2: #f1ecec;
    --text: #1d1a1f; --muted: #6c6570; --line: rgba(29, 26, 31, .10);
    --accent: #c13a6c; --on-accent: #ffffff; --danger: #c62828;
    --team-a: #d63a78; --team-b: #7447dc;   /* LenaMiu hồng, MiuLena tím — lấy từ màu logo */
    --shadow: 0 1px 2px rgba(29, 26, 31, .06), 0 10px 28px -14px rgba(29, 26, 31, .28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121014; --surface: #1b181e; --surface-2: #26222a;
      --text: #f3eff4; --muted: #a39ca8; --line: rgba(255, 255, 255, .09);
      --accent: #f06d9b; --on-accent: #1a0d13; --danger: #ff7b72;
      --team-a: #e5528c; --team-b: #8c62ee;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -14px rgba(0, 0, 0, .8);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 16px/1.6 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1120px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- trình phát ---------- */
  /* màn hình thấp (laptop) thì thu nhỏ khung phát, để tên video vẫn nằm trong màn hình */
  .watch {
    width: min(100%, calc((100vh - 230px) * 16 / 9)); margin: 0 auto 40px;
    scroll-margin-top: 12px;
  }
  .player {
    position: relative; aspect-ratio: 16 / 9; background: #000;
    border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
  }
  .player iframe, .player video, .facade { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player video { background: #000; object-fit: contain; }
  .facade {
    display: block; padding: 0; margin: 0; background: #000; cursor: pointer;
    color: #fff; font: inherit; text-decoration: none;
  }
  .facade img {
    width: 100%; height: 100%; object-fit: cover; display: block; opacity: .9;
    transition: opacity .25s ease, transform .5s ease;
  }
  .facade:hover img { opacity: 1; transform: scale(1.015); }
  .facade .play {
    position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
    transition: transform .2s ease;
  }
  .facade .play::after {
    content: ""; position: absolute; left: 30px; top: 23px;
    border-style: solid; border-width: 15px 0 15px 23px;
    border-color: transparent transparent transparent var(--on-accent);
  }
  .facade:hover .play { transform: scale(1.06); }
  .facade .on {
    position: absolute; left: 12px; bottom: 12px; padding: 4px 10px; border-radius: 999px;
    background: rgba(0, 0, 0, .7); font-size: .8rem; font-weight: 600;
  }

  .meta { padding-top: 14px; }
  .meta-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 12px;
  }
  .sources { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border-radius: 999px; }
  .src {
    font: inherit; font-size: .875rem; font-weight: 600; min-height: 36px; padding: 6px 16px;
    border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer;
  }
  .src[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
  .src:disabled { opacity: .4; cursor: not-allowed; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .ghost {
    display: inline-flex; align-items: center;
    font: inherit; font-size: .875rem; font-weight: 600; min-height: 36px; padding: 6px 16px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
    color: var(--text); cursor: pointer; text-decoration: none;
  }
  .kicker {
    margin: 0; font-size: .78rem; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--accent);
  }
  .watch h1 {
    margin: 2px 0 0; font-size: clamp(1.25rem, 2.4vw, 1.6rem); line-height: 1.3;
    letter-spacing: -.01em; text-wrap: balance;
  }
  .note { margin: 8px 0 0; color: var(--muted); white-space: pre-line; }
  .hint { margin: 8px 0 0; font-size: .85rem; color: var(--muted); }

  /* ---------- thanh chọn phụ đề (video RAW có sub rời, xem bằng máy chủ riêng) ---------- */
  .subbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
  .subbar-label { flex: none; margin-right: 2px; font-size: .85rem; font-weight: 600; color: var(--muted); }
  .sub {
    flex: none; font: inherit; font-size: .85rem; font-weight: 600; min-height: 34px; padding: 5px 14px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text); cursor: pointer;
  }
  .sub[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  /* chữ phụ đề hiện trên video (iPhone khi xem toàn màn hình dùng kiểu chữ của máy) */
  .player video::cue {
    background: rgba(0, 0, 0, .62); color: #fff; line-height: 1.35;
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
  }

  .stepper { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .step {
    display: block; min-width: 0; padding: 10px 14px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--surface); color: var(--text); text-decoration: none;
    transition: border-color .2s ease;
  }
  .step:hover { border-color: var(--accent); }
  .step.next { grid-column: 2; text-align: right; }
  .step small { display: block; font-size: .75rem; font-weight: 600; color: var(--muted); }
  .step span {
    display: block; font-size: .9rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- thư viện ---------- */
  .lib-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px 16px; margin-bottom: 12px;
  }
  .lib-head h2 { margin: 0; font-size: 1.1rem; }
  .count { color: var(--muted); font-weight: 500; }
  .search {
    flex: 1 1 220px; max-width: 340px; min-height: 40px; padding: 8px 16px;
    font: inherit; font-size: 16px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  }
  .search::placeholder { color: var(--muted); }
  .chips {
    display: flex; gap: 8px; margin: 0 0 16px; padding-bottom: 2px;
    overflow-x: auto; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; font: inherit; font-size: .85rem; font-weight: 600; min-height: 34px; padding: 5px 14px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
    color: var(--text); cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .grid {
    list-style: none; margin: 0; padding: 0; display: grid; gap: 22px 16px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
  .card { display: block; color: inherit; text-decoration: none; border-radius: 12px; }
  .thumb {
    position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden;
    border-radius: 10px; background: var(--surface-2);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
  .card:hover .thumb img { transform: scale(1.04); }
  /* nhãn trên ảnh bìa: nhiều nhãn thì xuống hàng (canh phải), mỗi nhãn luôn nằm trên một dòng */
  .badges {
    position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; flex-wrap: wrap-reverse;
    justify-content: flex-end; gap: 4px;
  }
  .badge {
    padding: 1px 6px; border-radius: 5px; background: rgba(0, 0, 0, .75); color: #fff;
    font-size: .68rem; font-weight: 600; line-height: 1.6; white-space: nowrap;
  }
  .badge.cc { background: var(--accent); color: var(--on-accent); }   /* video có nhiều thứ tiếng phụ đề */
  .badge.vi { background: #da251d; color: #ffde00; }                   /* chỉ có phụ đề tiếng Việt (màu cờ) */
  /* dòng nổi bật dưới tên video: chỉ có phụ đề tiếng Việt */
  .sub-only {
    display: inline-flex; align-items: center; gap: 6px; margin: 10px 0 0; padding: 5px 14px;
    border-radius: 999px; font-size: .875rem; font-weight: 700; line-height: 1.4;
    color: #b3160f; background: #fff1d6; border: 1px solid #f3c96b;
  }
  @media (prefers-color-scheme: dark) {
    .sub-only { color: #ffd76a; background: rgba(218, 37, 29, .22); border-color: rgba(255, 215, 106, .35); }
  }
  .card[aria-current="true"] .thumb { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  .card[aria-current="true"] .thumb::before {
    content: var(--now-label, "Đang xem"); position: absolute; left: 6px; top: 6px; z-index: 1;
    padding: 2px 9px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
    font-size: .72rem; font-weight: 700;
  }
  .c-title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-top: 8px; font-size: .95rem; font-weight: 600; line-height: 1.4;
  }
  .c-meta { display: block; margin-top: 2px; font-size: .8rem; color: var(--muted); }
  .empty { margin: 8px 0 0; color: var(--muted); }
  .local-note {
    margin: 0 0 16px; padding: 10px 14px; border-radius: 10px;
    background: var(--surface-2); color: var(--text); font-size: .875rem;
  }

  .foot {
    margin-top: 56px; padding-top: 16px; padding-bottom: 32px;
    border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem;
  }
  .foot p { margin: 0 0 4px; }
  .foot a { color: inherit; }
  .foot .social { white-space: nowrap; }   /* "𝕏 @tên" không bị tách dòng */

  /* ---------- hộp "Đăng lên X" ---------- */
  .sheet textarea {
    display: block; width: 100%; min-height: 170px; padding: 12px 14px; resize: vertical;
    font: inherit; font-size: 16px; line-height: 1.5; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
  }
  .sheet textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sheet-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .x-count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .x-count.over { color: var(--danger); font-weight: 600; }
  /* (khung hộp nổi, đầu trang, dải chữ chạy, hộp donate: ở site.css, dùng chung cho mọi trang) */
  .primary {
    display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 18px;
    border-radius: 999px; background: var(--accent); color: var(--on-accent);
    font-size: .9rem; font-weight: 700; text-decoration: none;
  }

  @media (max-width: 640px) {
    .player { margin: 0 calc(-1 * max(16px, env(safe-area-inset-left))); border-radius: 0; box-shadow: none; }
    .grid { grid-template-columns: 1fr 1fr; gap: 18px 12px; }
    .c-title { font-size: .9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<script>
  // videos.js (danh sách video + cấu hình), i18n.js (chữ giao diện 5 thứ tiếng) và site.js (dải chữ chạy,
  // đầu trang, hộp donate, đổi ngôn ngữ — dùng chung mọi trang).
  // GitHub Pages cho trình duyệt giữ file 10 phút; thêm ?v=giờ-hiện-tại để lần nào cũng lấy bản mới nhất.
  (function () { var v = Date.now(); document.write('<script src="videos.js?v=' + v + '"><\/script><script src="i18n.js?v=' + v + '"><\/script><script src="site.js?v=' + v + '"><\/script>'); })();
</script>

<main class="wrap">

  <!-- data-i18n / data-i18n-attr: chữ đổi theo ngôn ngữ (bảng chữ ở i18n.js) -->
  <section class="watch" id="watch" aria-label="Đang xem" data-i18n-attr="aria-label:v.watching" hidden>
    <div class="player" id="player"></div>
    <div class="meta">
      <div class="meta-row">
        <div class="sources" id="sources" role="group" aria-label="Nguồn phát" data-i18n-attr="aria-label:v.sources"></div>
        <div class="actions">
          <a class="ghost" id="openLink" href="#" target="_blank" rel="noopener"></a>
          <button type="button" class="ghost" id="xBtn" data-i18n="v.xBtn">Đăng lên X</button>
          <button type="button" class="ghost" id="shareBtn" data-i18n="v.share">Chia sẻ</button>
        </div>
      </div>
      <!-- chọn thứ tiếng phụ đề: chỉ hiện với video RAW có ô subs trong videos.js -->
      <div class="subbar" id="subbar" role="group" aria-label="Phụ đề" data-i18n-attr="aria-label:v.subsAria" hidden></div>
      <p class="kicker" id="watchKicker"></p>
      <h1 id="watchTitle"></h1>
      <!-- video chỉ có phụ đề tiếng Việt (in sẵn trong hình, không có ô subs): báo nổi bật ngay dưới tên -->
      <p class="sub-only" id="subsNote" hidden></p>
      <p class="note" id="watchNote"></p>
      <p class="hint" id="watchHint"></p>
      <nav class="stepper" id="stepper" aria-label="Video khác" data-i18n-attr="aria-label:v.others">
        <a class="step prev" id="prevLink" href="#"><small data-i18n="v.prev">‹ Trước</small><span></span></a>
        <a class="step next" id="nextLink" href="#"><small data-i18n="v.next">Sau ›</small><span></span></a>
      </nav>
    </div>
  </section>

  <section aria-labelledby="libTitle">
    <div class="lib-head">
      <h2 id="libTitle"><span data-i18n="v.all">Tất cả video</span> <span class="count" id="count"></span></h2>
      <input class="search" id="search" type="search" placeholder="Tìm video..."
             aria-label="Tìm video" data-i18n-attr="placeholder:v.search,aria-label:v.searchAria"
             autocomplete="off" spellcheck="false">
    </div>
    <div class="chips" id="chips" role="group" aria-label="Lọc theo nhóm" data-i18n-attr="aria-label:v.chips"></div>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden></p>
  </section>

</main>

<dialog class="sheet" id="xDialog" aria-labelledby="xTitle">
  <form method="dialog" class="sheet-in">
    <div class="sheet-head">
      <h2 id="xTitle" data-i18n="v.xBtn">Đăng lên X</h2>
      <button class="icon-btn" value="close" aria-label="Đóng" data-i18n-attr="aria-label:close">✕</button>
    </div>
    <p class="sheet-sub" data-i18n="v.xSub">Nội dung đã viết sẵn, sửa thoải mái trước khi đăng nha.</p>
    <textarea id="xText" rows="7" aria-label="Nội dung bài đăng" data-i18n-attr="aria-label:v.xText"></textarea>
    <div class="sheet-row">
      <button type="button" class="ghost" id="xAgain" data-i18n="v.xAgain">↻ Viết câu khác</button>
      <span class="x-count" id="xCount" aria-live="polite"></span>
    </div>
    <div class="sheet-actions">
      <button type="button" class="ghost" id="xCopy" data-i18n="v.xCopy">Chép nội dung</button>
      <a class="primary" id="xGo" href="https://x.com/intent/tweet" target="_blank" rel="noopener" autofocus data-i18n="v.xGo">Mở X để đăng ↗</a>
    </div>
  </form>
</dialog>

<footer class="foot wrap">
  <p id="footText"></p>
  <p id="visits" hidden></p>
  <p data-donate-wrap hidden><a href="#lumi" class="donate-link" data-donate></a></p>
  <!-- link X của người làm sub (site.socials trong videos.js) được thêm vào sau link YouTube -->
  <p id="channels"><span data-i18n="v.channel">Kênh của tụi mình:</span>
     <a href="https://www.youtube.com/@dangtthuynhi" target="_blank" rel="noopener">YouTube</a></p>
</footer>

<script>
(function () {
  'use strict';

  const DATA = window.VIETSUB || {};
  const SITE = Object.assign(
    { title: 'LenaMiu Sub', tagline: '', footer: '', dailymotionPlayerId: '', videoBase: '' }, DATA.site);

  // Ngôn ngữ: chữ giao diện ở i18n.js, chọn ngôn ngữ ở site.js (nút 🌐). Tên video dịch ở videos.js (title_en...).
  const LM = window.LM || {};
  const LANG = LM.lang || 'vi';
  const LOC = LM.locale || 'vi-VN';
  const VI = (window.LM_I18N || {}).vi || {};
  const t = LM.t || ((k, vars) => String(k in VI ? VI[k] : k)
    .replace(/\{(\w+)\}/g, (m, x) => (vars && x in vars ? String(vars[x]) : m)));
  const tr = LM.tr || ((o, f) => (o ? o[f] : ''));
  if (LM.applyI18n) LM.applyI18n();
  document.documentElement.style.setProperty('--now-label', JSON.stringify(t('v.watching')));
  // Tên nhóm đã dịch (site.groupNames trong videos.js), không có thì giữ nguyên tên nhóm
  function groupName(g) {
    const m = g && (SITE.groupNames || {})[g];
    return (m && LANG !== 'vi' && m[LANG]) || g;
  }
  // Link gửi đi (Chia sẻ, Đăng lên X) kèm ?lang= khi đang xem bằng tiếng nước ngoài, để người nhận thấy cùng thứ tiếng
  const langQuery = LANG === 'vi' ? '' : '?lang=' + LANG;
  if (LANG !== 'vi') {
    const canon = document.querySelector('link[rel="canonical"]');
    if (canon) canon.href = 'https://lenamiu.xyz/' + langQuery;
  }

  // Thứ tự ưu tiên khi một video có nhiều nguồn. Video trên máy chủ riêng (kho R2) xếp đầu:
  // phát bằng trình phát gốc của trình duyệt nên nhanh nhất, iPhone xem mượt.
  // Drive xếp sau Odysee vì trình phát Drive trên iPhone bị hai bộ nút chồng nhau.
  const SOURCES = ['file', 'youtube', 'odysee', 'drive', 'dailymotion'];
  const LABEL = { file: t('v.srcFile'), youtube: 'YouTube', odysee: 'Odysee', drive: 'Google Drive',
                  dailymotion: 'Dailymotion' };
  const BADGE = { file: t('v.badgeFile'), youtube: 'YouTube', odysee: 'Odysee', drive: 'Drive', dailymotion: 'Dailymotion' };
  // Địa chỉ máy chủ phát video (Cloudflare Worker + kho R2), vd https://lenamiu-video.xxx.workers.dev/
  const VIDEO_BASE = String(SITE.videoBase || '').trim().replace(/\/*$/, '/');
  const SRC_KEY = 'vietsub_src';
  // Lượt truy cập + lượt xem: máy chủ đếm là Cloudflare Worker (statsApi trong videos.js)
  const STATS_API = String(SITE.statsApi || '').trim().replace(/\/+$/, '');
  const views = {};          // id video → số lượt xem
  let statsReady = false;    // đã lấy được số liệu từ máy chủ chưa
  let siteVisits = 0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // Ảnh bìa lỗi (Drive hay giới hạn lượt tải ảnh) thì bỏ ảnh đi, để lại khung màu
  // thay vì biểu tượng ảnh vỡ
  function thumbImg(src, lazy) {
    const img = el('img');
    img.alt = '';
    if (lazy) { img.loading = 'lazy'; img.decoding = 'async'; }
    img.addEventListener('error', () => img.remove(), { once: true });
    img.src = src;
    return img;
  }

  function store(key, val) {
    try { return val === undefined ? localStorage.getItem(key) : localStorage.setItem(key, val); }
    catch (e) { return null; }
  }

  // Bỏ dấu tiếng Việt + chữ thường, để tìm "pls love" ra cả "Pls Love"
  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  }
  function slug(s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }

  // Nhận ID trần hoặc mọi kiểu link: youtu.be/…, watch?v=…, /shorts/…, /embed/…, /live/…
  function ytId(s) {
    s = String(s || '').trim();
    if (/^[\w-]{11}$/.test(s)) return s;
    const m = s.match(/(?:youtu\.be\/|[?&]v=|\/(?:embed|shorts|live)\/)([\w-]{11})/);
    return m ? m[1] : '';
  }
  // Nhận ID trần hoặc link dailymotion.com/video/…, dai.ly/…, ?video=…
  function dmId(s) {
    s = String(s || '').trim();
    if (/^x[0-9a-z]{4,}$/i.test(s)) return s;
    const m = s.match(/(?:dailymotion\.com\/(?:embed\/)?video\/|dai\.ly\/|[?&]video=)([0-9a-z]+)/i);
    return m ? m[1] : '';
  }
  // Nhận ID trần hoặc link drive.google.com/file/d/…/view, open?id=…, uc?id=…
  function driveId(s) {
    s = String(s || '').trim();
    const m = s.match(/(?:\/file\/d\/|[?&]id=)([\w-]{20,})/);
    if (m) return m[1];
    return /^[\w-]{25,}$/.test(s) ? s : '';
  }
  // Nhận link odysee.com/<tên>:<mã> (có thể kèm @kênh:x/ ở trước) hoặc lbry://<tên>#<mã>.
  // Trả về đường dẫn dạng "tên:mã" (chưa mã hoá) để ghép vào link nhúng / link xem.
  function odyseeId(s) {
    s = String(s || '').trim();
    let m = s.match(/odysee\.com\/(?:\$\/embed\/)?([^?#]+)/);
    if (m) { try { return decodeURIComponent(m[1]).replace(/\/+$/, ''); } catch (e) { return ''; } }
    m = s.match(/^lbry:\/\/(.+)$/);
    return m ? m[1].replace(/#/g, ':') : '';
  }
  // Video trên máy chủ riêng: tên file trên kho R2 (vd 'pls-love-ep2.mp4') hoặc nguyên link https://...mp4
  function fileUrl(s) {
    s = String(s || '').trim();
    if (!s) return '';
    if (/^https?:\/\//i.test(s)) return s;
    if (!VIDEO_BASE || VIDEO_BASE === '/') {
      console.warn('[vietsub] Có video "' + s + '" nhưng chưa điền videoBase trong videos.js.');
      return '';
    }
    return VIDEO_BASE + s.replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
  }
  function odyseePath(p) {
    return p.split('/').map((seg) => encodeURIComponent(seg).replace(/%3A/gi, ':').replace(/%40/g, '@')).join('/');
  }

  // Ngày đăng: tiếng Việt viết 08/11/2026, thứ tiếng khác viết theo kiểu của họ (Nov 8, 2026 · 2026年11月8日...)
  function fmtDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '').trim());
    if (!m) return String(s || '');
    if (LANG !== 'vi') {
      try {
        return new Intl.DateTimeFormat(LOC, { day: 'numeric', month: 'short', year: 'numeric' })
          .format(new Date(+m[1], +m[2] - 1, +m[3]));
      } catch (e) { /* trình duyệt cũ: dùng kiểu ngày/tháng/năm */ }
    }
    return m[3] + '/' + m[2] + '/' + m[1];
  }

  /* ---------- phụ đề rời: nhiều thứ tiếng cho cùng một video RAW ---------- */
  const SUB_KEY = 'lm_sub';                  // thứ tiếng phụ đề người xem đã chọn ('off' = tắt)
  const SUB_V = Date.now();                  // GitHub Pages giữ file 10 phút: thêm ?v= để sửa sub là thấy ngay
  const LANG_CODES = (LM.langs || []).map((l) => l.code);
  // xếp thứ tiếng theo thứ tự trong menu 🌐 (Việt, Anh, Thái, Trung, Indonesia), thứ tiếng lạ để sau cùng
  function subOrder(codes) {
    const rank = (c) => (LANG_CODES.includes(c) ? LANG_CODES.indexOf(c) : 99);
    return codes.slice().sort((a, b) => rank(a) - rank(b));
  }
  function subName(code) {
    const l = (LM.langs || []).find((x) => x.code === code);
    return l ? l.name.replace(/[（(].*$/, '').trim() : code.toUpperCase();
  }
  // Sub mặc định: lựa chọn lần trước → thứ tiếng của trang đang xem → tiếng Việt → thứ tiếng đầu tiên có
  function chooseSub(v) {
    if (!v.subLangs.length) return '';
    const saved = store(SUB_KEY);
    if (saved === 'off') return 'off';
    for (const c of [saved, LANG, 'vi']) if (c && v.subs[c]) return c;
    return v.subLangs[0];
  }

  /* ---------- đọc danh sách video ---------- */
  const used = new Set();
  const videos = (DATA.videos || []).map((v, i) => {
    const ids = { file: fileUrl(v.video), youtube: ytId(v.youtube), odysee: odyseeId(v.odysee),
                  drive: driveId(v.drive), dailymotion: dmId(v.dailymotion) };
    if (!SOURCES.some((s) => ids[s])) {
      console.warn('[vietsub] Bỏ qua video thứ ' + (i + 1) + ' "' + (v.title || '') +
                   '": không đọc được link video nào (video, YouTube, Odysee, Google Drive, Dailymotion).');
      return null;
    }
    const base = slug(v.id || v.title) || 'video-' + (i + 1);
    let id = base;
    for (let n = 2; used.has(id); n++) id = base + '-' + n;
    used.add(id);
    // tìm kiếm được bằng tên / ghi chú ở mọi thứ tiếng (gõ tên tiếng Anh hay tiếng Việt đều ra)
    const allText = Object.keys(v).filter((k) => /^(title|note)(_[a-z]{2})?$/.test(k)).map((k) => v[k]);
    // Phụ đề rời (video RAW): subs: { vi: 'id.vi.vtt', en: 'id.en.vtt' } → file trong thư mục subs/
    const subs = {};
    if (v.subs && typeof v.subs === 'object' && ids.file) {
      for (const [k, f] of Object.entries(v.subs)) {
        const code = String(k).toLowerCase(), file = String(f || '').trim();
        if (!/^[a-z]{2,3}$/.test(code) || !file) continue;
        subs[code] = /^https?:\/\//i.test(file) || file.includes('/') ? file : 'subs/' + file;
      }
    }
    const subLangs = subOrder(Object.keys(subs));
    return {
      id, ids, subs, subLangs,
      // chỉ có phụ đề tiếng Việt: chưa có sub rời (sub in cứng trong hình) hoặc sub rời chỉ có tiếng Việt
      viOnly: !subLangs.length || (subLangs.length === 1 && subLangs[0] === 'vi'),
      title: tr(v, 'title') || t('v.untitled'),
      group: v.group || '', date: v.date || '', note: tr(v, 'note') || '', hashtags: v.hashtags || '',
      thumb: v.thumb ||
        // lệnh up-video tải kèm ảnh bìa .jpg cùng tên với video
        (ids.file && /\.mp4(\?|$)/i.test(ids.file) ? ids.file.replace(/\.mp4(\?|$)/i, '.jpg$1')
        : ids.youtube ? 'https://i.ytimg.com/vi/' + ids.youtube + '/hqdefault.jpg'
        : ids.drive ? 'https://drive.google.com/thumbnail?id=' + ids.drive + '&sz=w640'
        : ids.dailymotion ? 'https://www.dailymotion.com/thumbnail/video/' + ids.dailymotion
        : ''),
      // Odysee không có link ảnh bìa cố định → hỏi API của Odysee sau (fillOdyseeThumbs)
      needThumb: !v.thumb && !ids.file && !ids.youtube && !!ids.odysee,
      text: norm([...allText, v.group, groupName(v.group), fmtDate(v.date)].join(' ')),
      visible: true
    };
  }).filter(Boolean);

  const has = (v, s) => !!v.ids[s];
  const sourcesOf = (v) => SOURCES.filter((s) => has(v, s));

  let cur = null;
  let src = 'youtube';
  let group = '';
  let query = '';
  let curSub = '';           // thứ tiếng phụ đề đang bật cho video đang xem ('off' = tắt, '' = video không có sub rời)

  $('footText').textContent = tr(SITE, 'footer') || '';
  // Chân trang: thêm trang X của người làm sub cạnh link YouTube
  (LM.socials || []).forEach((p) => $('channels').append(' · ', LM.socialLink(p, '𝕏 @' + p.handle)));

  /* (hộp donate, thanh PK, dải chữ chạy: ở site.js, dùng chung cho mọi trang; trang này gọi qua window.LM) */

  // Mở thẳng file trong máy thì trình duyệt không gửi Referer → YouTube báo lỗi 153.
  // Chỉ chủ trang mới mở kiểu này, nên nhắc ngay trên trang cho khỏi tưởng web hỏng.
  if (location.protocol === 'file:') {
    document.querySelector('main').prepend(el('p', 'local-note',
      'Đang mở file trong máy nên YouTube sẽ báo “Lỗi 153”. Xem thử trên ' +
      'https://lenamiu.xyz hoặc mở bằng Live Server thì video chạy bình thường.'));
  }

  if (!videos.length) {
    $('count').textContent = '(0)';
    $('search').hidden = true;
    $('empty').hidden = false;
    $('empty').textContent = t('v.empty');
    console.info('[vietsub] Thêm video vào videos.js nha.');
    return;
  }
  $('watch').hidden = false;

  /* ---------- thư viện ---------- */
  videos.forEach((v) => {
    const li = el('li');
    const a = el('a', 'card');
    a.href = '#' + v.id;
    a.dataset.id = v.id;

    const thumb = el('span', 'thumb');
    const badges = el('span', 'badges');
    if (v.subLangs.length > 1) {          // nhiều thứ tiếng phụ đề: nhãn CC, rê chuột thấy danh sách
      const cc = el('span', 'badge cc', 'CC');
      cc.title = v.subLangs.map(subName).join(' · ');
      badges.append(cc);
    } else if (v.viOnly) {                // chỉ có phụ đề tiếng Việt: nhãn ★ Sub Việt màu cờ
      const vi = el('span', 'badge vi', '★ ' + t('v.viBadge'));
      vi.title = t('v.viBadgeTitle');
      badges.append(vi);
    }
    sourcesOf(v).forEach((s) => badges.append(el('span', 'badge', BADGE[s])));
    if (v.thumb) thumb.append(thumbImg(v.thumb, true));
    thumb.append(badges);

    const metaEl = el('span', 'c-meta');   // nhóm · ngày · lượt xem
    a.append(thumb, el('span', 'c-title', v.title), metaEl);
    li.append(a);
    $('grid').append(li);
    v.li = li; v.card = a; v.metaEl = metaEl;
    paintMeta(v);
  });

  // Lấy ảnh bìa cho các video Odysee qua API của Odysee, có ảnh rồi thì gắn vào thẻ video
  // (và khung phát nếu đang chờ bấm phát).
  // Cố ý KHÔNG đặt Content-Type: application/json — kiểu đó trình duyệt phải hỏi trước
  // (preflight) mà Odysee trả lời thiếu Access-Control-Allow-Origin nên bị chặn.
  // Gửi dạng chữ thường (text/plain) thì không cần hỏi trước, Odysee vẫn đọc được.
  (function fillOdyseeThumbs() {
    const need = videos.filter((v) => v.needThumb);
    if (!need.length || !window.fetch) return;
    const urls = need.map((v) => 'lbry://' + v.ids.odysee.replace(/:/g, '#'));
    fetch('https://api.na-backend.odysee.com/api/v1/proxy?m=resolve', {
      method: 'POST',
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'resolve', params: { urls } })
    })
      .then((r) => r.json())
      .then((d) => {
        need.forEach((v, i) => {
          const c = d && d.result && d.result[urls[i]];
          const t = c && c.value && c.value.thumbnail && c.value.thumbnail.url;
          if (!t) return;
          v.thumb = t;
          const box = v.card.querySelector('.thumb');
          const old = box.querySelector('img');
          if (old) old.remove();
          box.prepend(thumbImg(t, true));
          if (v === cur && !$('player').querySelector('iframe, video')) showPlayer(false);
        });
      })
      .catch(() => {});   // không lấy được thì để khung màu
  })();

  const groups = [...new Set(videos.map((v) => v.group).filter(Boolean))];
  if (groups.length >= 2) {
    ['', ...groups].forEach((g) => {
      const b = el('button', 'chip', g ? groupName(g) : t('v.allChip'));
      b.type = 'button';
      b.setAttribute('aria-pressed', String(g === group));
      b.addEventListener('click', () => {
        group = g;
        $('chips').querySelectorAll('.chip')
          .forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
        applyFilter();
      });
      $('chips').append(b);
    });
  } else {
    $('chips').hidden = true;
  }

  $('search').addEventListener('input', (e) => { query = e.target.value; applyFilter(); });

  function applyFilter() {
    const terms = norm(query).split(/\s+/).filter(Boolean);
    let shown = 0;
    videos.forEach((v) => {
      v.visible = (!group || v.group === group) && terms.every((t) => v.text.includes(t));
      v.li.hidden = !v.visible;
      if (v.visible) shown++;
    });
    $('count').textContent = shown === videos.length
      ? '(' + videos.length + ')' : '(' + shown + '/' + videos.length + ')';
    $('empty').hidden = shown > 0;
    if (!shown) {
      $('empty').textContent = query.trim() ? t('v.noMatch', { q: query.trim() }) : t('v.groupEmpty');
    }
    updateStepper();
  }

  /* ---------- trình phát ---------- */
  // Dailymotion chặn nhúng ("Forbidden") nếu thiếu Player ID,
  // nên chưa có Player ID thì mở video qua trang Dailymotion
  const DM_PLAYER = String(SITE.dailymotionPlayerId || '').trim();
  if (!DM_PLAYER && videos.some((v) => has(v, 'dailymotion'))) {
    console.warn('[vietsub] Chưa điền dailymotionPlayerId trong videos.js: video Dailymotion ' +
                 'sẽ mở qua trang Dailymotion thay vì phát ngay trên web.');
  }

  function embedUrl(v, s) {
    if (s === 'youtube') {
      // origin: báo thêm cho YouTube trang nào đang nhúng, phòng khi trình duyệt chặn Referer
      const origin = /^https?:$/.test(location.protocol)
        ? '&origin=' + encodeURIComponent(location.origin) : '';
      return 'https://www.youtube-nocookie.com/embed/' + v.ids.youtube +
             '?autoplay=1&rel=0&playsinline=1&hl=' + (LANG === 'zh' ? 'zh-CN' : LANG) + origin;
    }
    if (s === 'odysee') return 'https://odysee.com/$/embed/' + odyseePath(v.ids.odysee);
    if (s === 'drive') return 'https://drive.google.com/file/d/' + v.ids.drive + '/preview';
    return 'https://geo.dailymotion.com/player/' + DM_PLAYER + '.html?video=' + v.ids.dailymotion;
  }

  function watchUrl(v, s) {
    if (s === 'file') return v.ids.file;
    if (s === 'youtube') return 'https://www.youtube.com/watch?v=' + v.ids.youtube;
    if (s === 'odysee') return 'https://odysee.com/' + odyseePath(v.ids.odysee);
    if (s === 'drive') return 'https://drive.google.com/file/d/' + v.ids.drive + '/view';
    return 'https://www.dailymotion.com/video/' + v.ids.dailymotion;
  }

  // Chưa bấm phát thì chỉ hiện ảnh bìa, để trang mở nhanh trên điện thoại
  function showPlayer(play) {
    const box = $('player');
    box.textContent = '';
    const linkOut = src === 'dailymotion' && !DM_PLAYER;
    if (play) countView(cur);
    if (play && src === 'file') {
      // Trình phát gốc của trình duyệt: không quảng cáo, không giao diện lạ, iPhone phát trong trang
      const vd = el('video');
      vd.controls = true;
      vd.playsInline = true;
      vd.setAttribute('playsinline', '');
      vd.preload = 'metadata';
      if (cur.thumb) vd.poster = cur.thumb;
      vd.title = cur.title;
      vd.src = cur.ids.file;
      // phụ đề rời: mỗi thứ tiếng một <track>; bật đúng thứ tiếng đang chọn
      // (cũng hiện trong nút CC của trình phát, và khi xem toàn màn hình trên iPhone)
      cur.subLangs.forEach((code) => {
        const tk = el('track');
        tk.kind = 'subtitles';
        tk.srclang = code;
        tk.label = subName(code);
        tk.src = cur.subs[code] + (cur.subs[code].includes('?') ? '&' : '?') + 'v=' + SUB_V;
        if (code === curSub) tk.default = true;
        vd.append(tk);
      });
      box.append(vd);
      if (cur.subLangs.length) {
        const born = Date.now();
        applySub(vd);
        vd.addEventListener('loadedmetadata', () => applySub(vd), { once: true });
        vd.textTracks.addEventListener('change', () => {
          const showing = [...vd.textTracks].filter((tt) => tt.mode === 'showing');
          const wanted = curSub === 'off' ? 0 : 1;
          // Lúc video vừa mở, trình duyệt hay TỰ bật thêm sub theo ngôn ngữ của máy (2 sub chồng lên nhau):
          // không coi đó là người xem chọn, đặt lại đúng thứ tiếng trang đã chọn. Lúc nào cũng chỉ 1 sub.
          if (showing.length > 1 || Date.now() - born < 2000) {
            if (showing.length !== wanted || (wanted && showing[0].language !== curSub)) applySub(vd);
            return;
          }
          // người xem đổi sub bằng nút CC của trình phát → thanh chọn bên dưới đổi theo, nhớ lựa chọn
          const code = showing.length ? showing[0].language : 'off';
          if (code !== curSub) { curSub = code; store(SUB_KEY, code); paintSubbar(); }
        });
      }
      const p = vd.play();
      if (p && p.catch) p.catch(() => {});   // trình duyệt chặn tự phát thì người xem bấm nút phát
      return;
    }
    if (play && !linkOut) {
      const f = el('iframe');
      f.src = embedUrl(cur, src);
      f.title = cur.title + ' — ' + LABEL[src];
      f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media; web-share';
      f.allowFullscreen = true;
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      box.append(f);
      return;
    }
    const b = el(linkOut ? 'a' : 'button', 'facade');
    if (linkOut) {
      b.href = watchUrl(cur, 'dailymotion');
      b.target = '_blank';
      b.rel = 'noopener';
      b.setAttribute('aria-label', t('v.openDm', { title: cur.title }));
      b.addEventListener('click', () => countView(cur));
    } else {
      b.type = 'button';
      b.setAttribute('aria-label', t('v.play', { title: cur.title, src: LABEL[src] }));
      b.addEventListener('click', () => showPlayer(true));
    }
    if (cur.thumb) b.append(thumbImg(cur.thumb));
    b.append(el('span', 'play'),
             el('span', 'on', linkOut ? t('v.openDmShort') : t('v.watchOn', { src: LABEL[src] })));
    box.append(b);
  }

  function applySub(vd) {
    [...vd.textTracks].forEach((tt) => { tt.mode = tt.language === curSub ? 'showing' : 'disabled'; });
  }
  // Thanh chọn phụ đề: chỉ hiện khi video có sub rời và đang xem bằng máy chủ riêng
  function paintSubbar() {
    const bar = $('subbar');
    const show = cur.subLangs.length > 0 && src === 'file';
    const hadFocus = bar.contains(document.activeElement);
    bar.hidden = !show;
    if (show) {
      bar.replaceChildren(el('span', 'subbar-label', t('v.subsLabel')), ...[...cur.subLangs, 'off'].map((code) => {
        const b = el('button', 'sub', code === 'off' ? t('v.subsOff') : subName(code));
        b.type = 'button';
        b.dataset.sub = code;
        if (code !== 'off') b.lang = code;
        b.setAttribute('aria-pressed', String(code === curSub));
        return b;
      }));
      if (hadFocus) bar.querySelector('[aria-pressed="true"]').focus();
    }
    // Video chỉ có phụ đề tiếng Việt: báo nổi bật ngay dưới tên (mọi thứ tiếng)
    const note = cur.viOnly && t('v.subsNote');
    $('subsNote').textContent = note || '';
    $('subsNote').hidden = !note;
  }
  $('subbar').addEventListener('click', (e) => {
    const b = e.target.closest('.sub');
    if (!b || b.dataset.sub === curSub) return;
    curSub = b.dataset.sub;
    store(SUB_KEY, curSub);
    paintSubbar();
    const vd = $('player').querySelector('video');
    if (vd) applySub(vd);                // đang phát thì đổi sub luôn, không phát lại từ đầu
  });

  function select(id, play) {
    cur = videos.find((v) => v.id === id) || videos[0];
    // Video có trên máy chủ riêng thì luôn mở bằng nguồn đó trước (nhanh nhất), kể cả khi lần trước
    // người xem đã chọn nguồn khác. Video không có thì mới dùng nguồn đã chọn lần trước.
    const pref = store(SRC_KEY);
    src = has(cur, 'file') ? 'file' : has(cur, pref) ? pref : sourcesOf(cur)[0];
    curSub = chooseSub(cur);

    paintKicker();
    $('watchTitle').textContent = cur.title;
    $('watchNote').textContent = cur.note;
    $('watchNote').hidden = !cur.note;
    document.title = cur.title + ' · ' + SITE.title;

    videos.forEach((v) => {
      if (v === cur) v.card.setAttribute('aria-current', 'true');
      else v.card.removeAttribute('aria-current');
    });
    updateSources();
    updateStepper();
    showPlayer(play);
  }

  // Chỉ hiện nút cho những nguồn video này có; một nguồn thì khỏi hiện nút chuyển
  function updateSources() {
    const box = $('sources');
    const list = sourcesOf(cur);
    const hadFocus = box.contains(document.activeElement);
    box.textContent = '';
    box.hidden = list.length < 2;
    paintSubbar();                       // đổi nguồn phát: thanh phụ đề chỉ có khi xem bằng máy chủ riêng
    list.forEach((s) => {
      const b = el('button', 'src', LABEL[s]);
      b.type = 'button';
      b.dataset.src = s;
      b.setAttribute('aria-pressed', String(s === src));
      box.append(b);
    });
    if (hadFocus && !box.hidden) box.querySelector('[aria-pressed="true"]').focus();

    $('openLink').href = watchUrl(cur, src);
    $('openLink').textContent = t('v.openOn', { src: LABEL[src] });
    const others = list.filter((s) => s !== src).map((s) => LABEL[s]);
    $('watchHint').textContent = others.length
      ? t('v.hint', { others: others.join(t('v.or')), src: LABEL[src] })
      : t('v.hint1', { src: LABEL[src] });
  }

  $('sources').addEventListener('click', (e) => {
    const b = e.target.closest('.src');
    if (!b || b.dataset.src === src) return;
    src = b.dataset.src;
    store(SRC_KEY, src);
    updateSources();
    showPlayer(!!$('player').querySelector('iframe, video'));   // đang phát thì phát tiếp bằng nguồn mới
  });

  // Trước / sau: đi trong danh sách đang lọc, nếu video đang xem nằm trong đó
  function updateStepper() {
    if (!cur) return;
    const list = cur.visible ? videos.filter((v) => v.visible) : videos;
    const i = list.indexOf(cur);
    setStep($('prevLink'), list[i - 1]);
    setStep($('nextLink'), list[i + 1]);
    $('stepper').hidden = !list[i - 1] && !list[i + 1];
  }
  function setStep(a, v) {
    a.hidden = !v;
    if (!v) return;
    a.href = '#' + v.id;
    a.dataset.id = v.id;
    a.querySelector('span').textContent = v.title;
  }

  /* ---------- link riêng cho từng video: lenamiu.xyz/#id ---------- */
  function idFromHash() {
    try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; }
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-id]');
    if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    const id = a.dataset.id;
    if (id !== cur.id) history.pushState(null, '', '#' + id);
    select(id, true);
    $('watch').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  });

  function onNavigate() {
    const id = idFromHash();
    if (window.LM && LM.isDonateHash(id)) { LM.openDonate(); return; }   // link #lumi: mở hộp QR, giữ video đang xem
    if (!cur || (id || videos[0].id) !== cur.id) select(id, false);
  }
  window.addEventListener('popstate', onNavigate);
  window.addEventListener('hashchange', onNavigate);

  $('shareBtn').addEventListener('click', async () => {
    const btn = $('shareBtn');
    const url = location.origin + location.pathname + langQuery + '#' + cur.id;
    try {
      if (navigator.share && matchMedia('(pointer: coarse)').matches) {
        await navigator.share({ title: cur.title, url });
        return;
      }
      await navigator.clipboard.writeText(url);
      btn.textContent = t('v.linkCopied');
      setTimeout(() => { btn.textContent = t('v.share'); }, 2000);
    } catch (err) {
      if (err && err.name === 'AbortError') return;   // tự tắt bảng chia sẻ
      window.prompt(t('v.sharePrompt'), url);
    }
  });

  /* ---------- Đăng lên X: viết sẵn bài đăng rồi mở khung soạn bài của X ---------- */
  // Mẫu câu và hashtag nằm trong videos.js (site.share). Mỗi lần bấm chọn ngẫu nhiên một mẫu.
  // Mẫu câu theo ngôn ngữ: templates_en, templates_th... trong videos.js; không có thì dùng mẫu tiếng Việt
  // (tiếng nước ngoài mà chưa có mẫu thì dùng mẫu chung chỉ có tên video + link, khỏi lẫn câu tiếng Việt)
  const SHARE = Object.assign({ hashtags: '', templates: [] }, SITE.share);
  const ownTpl = LANG === 'vi' ? SHARE.templates : SHARE['templates_' + LANG];
  const TEMPLATES = (Array.isArray(ownTpl) ? ownTpl : []).filter(Boolean);
  if (!TEMPLATES.length) TEMPLATES.push(LANG === 'vi' ? '[Vietsub] LenaMiu | {title}\n{link}\n\n{hashtags}' : 'LenaMiu | {title}\n{link}\n\n{hashtags}');
  // Luôn dùng link thật của trang (kể cả khi đang thử trong máy)
  const SITE_URL = 'https://lenamiu.xyz/' + langQuery;
  let lastTpl = -1;

  function makePost(v) {
    let pool = TEMPLATES.map((t, i) => i).filter((i) => v.group || !TEMPLATES[i].includes('{group}'));
    if (!pool.length) pool = TEMPLATES.map((t, i) => i);
    if (pool.length > 1) pool = pool.filter((i) => i !== lastTpl);   // bấm lại thì ra câu khác
    lastTpl = pool[Math.floor(Math.random() * pool.length)];
    const tags = [...new Set((SHARE.hashtags + ' ' + v.hashtags).split(/\s+/).filter(Boolean))].join(' ');
    const val = { title: v.title, group: groupName(v.group), link: SITE_URL + '#' + v.id, hashtags: tags };
    return TEMPLATES[lastTpl].replace(/\{(title|group|link|hashtags)\}/g, (m, k) => val[k])
      .replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  // Đếm ký tự theo cách của X: link nào cũng tính 23; chữ Latin cơ bản, tiếng Thái tính 1;
  // chữ có dấu tiếng Việt (ạ, ố, ữ...), emoji tính 2.
  function xLength(t) {
    let n = 0;
    t = t.normalize('NFC').replace(/https?:\/\/\S+/g, () => { n += 23; return ''; });
    for (const ch of t) {
      const c = ch.codePointAt(0);
      if (c === 0x200D || (c >= 0xFE00 && c <= 0xFE0F) || (c >= 0x1F3FB && c <= 0x1F3FF)) continue;
      n += (c <= 0x10FF || (c >= 0x2000 && c <= 0x200D) || (c >= 0x2010 && c <= 0x201F) ||
            (c >= 0x2032 && c <= 0x2037)) ? 1 : 2;
    }
    return n;
  }

  const xd = $('xDialog');
  function xRefresh() {
    const ta = $('xText');
    const t = ta.value;
    const n = xLength(t);
    // ô nội dung tự cao theo chữ (tối đa nửa màn hình), để thấy hết bài mà khỏi cuộn
    ta.style.height = 'auto';
    if (ta.scrollHeight) ta.style.height = Math.min(ta.scrollHeight + 2, innerHeight * 0.5) + 'px';
    $('xGo').href = 'https://x.com/intent/tweet?text=' + encodeURIComponent(t);
    $('xCount').textContent = n > 280 ? t('v.xOver', { n }) : n + '/280';
    $('xCount').classList.toggle('over', n > 280);
  }
  function xFill() { $('xText').value = makePost(cur); xRefresh(); }

  $('xBtn').addEventListener('click', () => {
    xFill();
    if (typeof xd.showModal === 'function') { xd.showModal(); xRefresh(); }   // đo lại chiều cao khi hộp đã hiện
    else window.open($('xGo').href, '_blank', 'noopener');   // trình duyệt quá cũ: mở X luôn
  });
  $('xAgain').addEventListener('click', xFill);
  $('xText').addEventListener('input', xRefresh);
  $('xGo').addEventListener('click', () => setTimeout(() => xd.close(), 300));
  xd.addEventListener('click', (e) => { if (e.target === xd) xd.close(); });   // bấm ra ngoài thì đóng
  $('xCopy').addEventListener('click', async () => {
    const btn = $('xCopy');
    try { await navigator.clipboard.writeText($('xText').value); }
    catch (e) { $('xText').select(); document.execCommand('copy'); }
    btn.textContent = t('v.xCopied');
    setTimeout(() => { btn.textContent = t('v.xCopy'); }, 2000);
  });

  /* ---------- lượt truy cập + lượt xem ---------- */
  // 1 người chỉ được tính 1 lượt truy cập / ngày và 1 lượt xem mỗi video / ngày (máy chủ kiểm tra lại lần nữa)
  const fmtNum = (n) => Number(n).toLocaleString(LOC);
  function viewsText(v) { return statsReady && views[v.id] ? t('v.views', { n: fmtNum(views[v.id]) }) : ''; }
  function metaText(v) { return [groupName(v.group), fmtDate(v.date), viewsText(v)].filter(Boolean).join(' · '); }
  function paintMeta(v) {
    v.metaEl.textContent = metaText(v);
    v.metaEl.hidden = !v.metaEl.textContent;
    if (v === cur) paintKicker();
  }
  function paintKicker() {
    const k = metaText(cur);
    $('watchKicker').textContent = k;
    $('watchKicker').hidden = !k;
  }
  function paintVisits() {
    if (!statsReady || !siteVisits) return;
    $('visits').textContent = t('v.visits', { n: fmtNum(siteVisits) });
    $('visits').hidden = false;
  }

  // Mã ngẫu nhiên cho mỗi trình duyệt (không chứa thông tin cá nhân), để đếm "mỗi người 1 lượt"
  function visitorId() {
    let id = store('lm_vid');
    if (!/^[a-f0-9]{16,32}$/.test(id || '')) {
      const a = new Uint8Array(12);
      crypto.getRandomValues(a);
      id = [...a].map((b) => b.toString(16).padStart(2, '0')).join('');
      store('lm_vid', id);
    }
    return id;
  }
  // Gửi 1 lượt đếm. Hôm nay đã gửi rồi thì thôi (đỡ tốn lượt gọi máy chủ). Trả về true nếu được tính.
  function hit(name) {
    if (!STATS_API || !/^https?:$/.test(location.protocol)) return Promise.resolve(false);
    const day = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
    let done;
    try { done = JSON.parse(store('lm_hits') || 'null'); } catch (e) { done = null; }
    if (!done || done.d !== day || !Array.isArray(done.n)) done = { d: day, n: [] };
    if (done.n.includes(name)) return Promise.resolve(false);
    done.n.push(name);
    store('lm_hits', JSON.stringify(done));
    return fetch(STATS_API + '/hit', { method: 'POST', body: JSON.stringify({ k: name, u: visitorId() }), keepalive: true })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => !!(d && d.counted))
      .catch(() => false);
  }
  function countView(v) {
    hit('v:' + v.id).then((ok) => {
      if (ok && statsReady) { views[v.id] = (views[v.id] || 0) + 1; paintMeta(v); }
    });
  }
  async function loadStats() {
    if (!STATS_API) return;
    const countedSite = await hit('site');
    try {
      const r = await fetch(STATS_API + '/stats', { cache: 'no-store' });
      if (!r.ok) return;
      const d = await r.json();
      siteVisits = Number(d.site) || 0;
      if (countedSite && !siteVisits) siteVisits = 1;
      Object.assign(views, d.videos || {});
      statsReady = true;
    } catch (e) { return; }
    paintVisits();
    videos.forEach(paintMeta);
  }

  applyFilter();
  select(idFromHash(), false);
  loadStats();
})();
</script>
